<template id="s05-stat-template">
  <script src="assets/gsap.min.js"></script>
  <script src="assets/deck.js"></script>

  <div data-composition-id="s05-stat" data-start="0" data-duration="2.1" data-width="1920" data-height="1080">
    <div class="dw-slide">
      <div class="dw-panel">
        <div class="dw-chrome"><div class="dw-brand">Digiwell<span class="dw-dot">.</span></div><div>THE PROBLEM</div><div>05&nbsp;/&nbsp;09</div></div>
          <div class="dw-rule"></div>
        <div class="dw-content st-grid">
          <div class="st-num"><span class="st-val">0</span><span class="st-unit">min</span></div>
          <div class="st-side">
            <div class="dw-eyebrow">Sample stat &middot; swap in a client result</div>
            <div class="dw-h-m st-label" data-words>to see exactly where your growth is leaking.</div>
            <div class="dw-body st-src">The free AI Growth Scorecard returns your score and the three fixes worth doing first.</div>
          </div>
        </div>
        <div class="dw-vignette"></div>
        <div class="dw-grain"></div>
      </div>
      <div class="dw-edge"></div>
    </div>

    <style>
      [data-composition-id="s05-stat"] .st-grid { flex-direction: row; align-items: center; gap: 80px; padding-top: 150px; }
      [data-composition-id="s05-stat"] .st-num { font-weight: 800; font-size: 420px; line-height: 0.8; letter-spacing: -20px; color: var(--dw-terra); white-space: nowrap; font-variant-numeric: tabular-nums; }
      [data-composition-id="s05-stat"] .st-unit { font-size: 110px; letter-spacing: -3px; margin-left: 18px; color: var(--dw-ink); }
      [data-composition-id="s05-stat"] .st-label { margin-top: 20px; }
      [data-composition-id="s05-stat"] .st-src { margin-top: 30px; max-width: 820px; }
    </style>

    <script>
      (function () {
        var SLOT = 2.1;
        var root = document.querySelector('[data-composition-id="s05-stat"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        DW.words(root);
        var tl = gsap.timeline({ paused: true });
        var t0 = DW.enter(tl, root);
        DW.rise(tl, q('.st-num'), t0, { y: 120, duration: 0.6 });
        var v = q('.st-val'), n = { v: 0 };
        tl.to(n, { v: 2, duration: 0.7, ease: 'power3.out', onUpdate: function () { v.textContent = Math.round(n.v); } }, t0 + 0.05);
        DW.rise(tl, q('.dw-eyebrow'), t0 + 0.2, { y: 0, x: -30 });
        DW.rise(tl, qa('.st-label .dw-w'), t0 + 0.26, { y: 60, stagger: 0.035 });
        DW.rise(tl, q('.st-src'), t0 + 0.62, { y: 20, ease: 'power2.out' });
        DW.hold(tl, SLOT);
        window.__timelines = window.__timelines || {};
        window.__timelines["s05-stat"] = tl;
      })();
    </script>
  </div>
</template>
