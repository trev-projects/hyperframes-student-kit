    <style>
      [data-composition-id="s08-compare"] .cp-head { margin-top: 18px; }
      [data-composition-id="s08-compare"] .cp-row { margin-top: 70px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
      [data-composition-id="s08-compare"] .cp-col { padding: 50px 54px; border-radius: 26px; }
      [data-composition-id="s08-compare"] .cp-before { border: 1px dashed var(--dw-card-border); }

    <script>
      (function () {
        var SLOT = 2.45;
        var root = document.querySelector('[data-composition-id="s08-compare"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        DW.words(root);
        var tl = gsap.timeline({ paused: true });
        var t0 = DW.enter(tl, root);
        DW.rise(tl, q('.dw-eyebrow'), t0, { y: 0, x: -30 });
        DW.rise(tl, qa('.cp-head .dw-w'), t0 + 0.08, { y: 70 });
        DW.rise(tl, q('.cp-before'), t0 + 0.4, { y: 0, x: -60, ease: 'power3.out' });

        DW.rise(tl, q('.cp-after'), t0 + 0.62, { y: 60, rotation: 1.5, ease: 'back.out(1.4)' });
        DW.rise(tl, qa('.cp-a'), t0 + 0.8, { y: 0, x: 24, stagger: 0.08, ease: 'power2.out' });
        DW.hold(tl, SLOT);
        window.__timelines = window.__timelines || {};
        window.__timelines["s08-compare"] = tl;
