<template id="01-url-to-card-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="01-url-to-card" data-start="0" data-duration="7" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="paper-grain"></div>

      <!-- LEFT: messy blog mock -->
      <div class="blog-panel">
        <div class="blog-label">&bull;&nbsp;ANY&nbsp;RECIPE&nbsp;WEBSITE</div>
        <div class="blog-url">recipeblog.com/my-italian-nonnas-secret-pasta-bake-summer-tuscany-…</div>
        <div class="blog-ad">ADVERTISEMENT</div>
        <div class="blog-title">My Italian nonna's secret pasta bake (and the summer I spent learning to cook in Tuscany)…</div>
        <div class="blog-bar bb1"></div>
        <div class="blog-bar bb2"></div>
        <div class="blog-bar bb3"></div>
        <div class="blog-ad blog-ad-2">ADVERTISEMENT</div>
        <div class="blog-bar bb4"></div>
        <div class="blog-bar bb5"></div>
      </div>

      <!-- CENTER: amber play button + "GATHERED" mark -->
      <div class="bridge">
        <svg class="play-btn" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="38" fill="#f5a73a"/>
          <path d="M 32 26 L 56 40 L 32 54 Z" fill="#1f160f"/>
        </svg>
        <div class="bridge-label">GATHERED</div>
      </div>

      <!-- RIGHT: dark Gathered recipe card -->
      <div class="recipe-card">
        <div class="rc-header">
          <span class="rc-mark">&bull;&nbsp;GATHERED&nbsp;✓</span>
        </div>
        <div class="rc-photo" data-photo-slot="pasta-bake">
          <div class="rc-photo-stand"></div>
          <svg class="steam" viewBox="0 0 80 200" fill="none">
            <path d="M 25 180 Q 18 130 30 90 Q 42 50 28 10" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
            <path d="M 50 180 Q 60 140 48 100 Q 36 60 52 20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
          </svg>
        </div>
        <div class="rc-title">Nonna's Tuscan Pasta Bake</div>
        <div class="rc-pills">
          <span class="rc-pill rc-pill-time">55&nbsp;min</span>
          <span class="rc-pill rc-pill-serves">Serves&nbsp;6</span>
          <span class="rc-pill rc-pill-veg">Vegetarian</span>
        </div>
        <div class="rc-ingredients">
          <div class="rc-ing"><span class="rc-ing-name">Rigatoni</span><span class="rc-ing-amt">500g</span></div>
          <div class="rc-ing"><span class="rc-ing-name">Passata</span><span class="rc-ing-amt">700ml</span></div>
          <div class="rc-ing"><span class="rc-ing-name">Mozzarella</span><span class="rc-ing-amt">250g</span></div>
          <div class="rc-ing"><span class="rc-ing-name">Fresh basil</span><span class="rc-ing-amt">1 handful</span></div>
        </div>

        <div class="toast">
          <svg viewBox="0 0 24 24" fill="none" class="toast-check">
            <circle cx="12" cy="12" r="10" fill="#5e7140"/>
            <path d="M 7 12.5 L 10.5 16 L 17 9" stroke="#f8f1e4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="toast-text">
            <div class="toast-line-1">Recipe Saved!</div>
            <div class="toast-line-2">Added to To Try</div>
          </div>
        </div>
      </div>

      <div class="page-sweep"></div>
    </div>

    <style>
      [data-composition-id="01-url-to-card"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #f8f1e4;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="01-url-to-card"] .stage { position: absolute; inset: 0; }
      [data-composition-id="01-url-to-card"] .paper-grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.10;
        background-image:
          radial-gradient(rgba(31,22,15,0.30) 1px, transparent 1px),
          radial-gradient(rgba(31,22,15,0.20) 1px, transparent 1px);
        background-size: 4px 4px, 7px 7px;
        background-position: 0 0, 2px 3px;
        z-index: 2;
      }

      /* ---------- LEFT: messy blog ---------- */
      [data-composition-id="01-url-to-card"] .blog-panel {
        position: absolute;
        top: 80px; left: 100px;
        width: 600px; height: 920px;
        background: #ffffff;
        border-radius: 12px;
        padding: 28px 32px;
        box-shadow: 0 6px 28px rgba(31,22,15,0.06);
        opacity: 0;
        transform: translateX(-40px);
        z-index: 5;
      }
      [data-composition-id="01-url-to-card"] .blog-label {
        font-weight: 600; font-size: 14px; color: #a8978a;
        letter-spacing: 0.18em; margin-bottom: 10px;
      }
      [data-composition-id="01-url-to-card"] .blog-url {
        font-size: 15px; color: #1f160f;
        margin-bottom: 22px; word-break: break-all;
      }
      [data-composition-id="01-url-to-card"] .blog-ad {
        background: #ece4d3; color: #b9ad99;
        font-weight: 600; font-size: 14px;
        text-align: center; padding: 24px 0;
        border-radius: 4px; margin-bottom: 22px;
        letter-spacing: 0.12em;
      }
      [data-composition-id="01-url-to-card"] .blog-ad-2 { padding: 32px 0; margin-top: 24px; }
      [data-composition-id="01-url-to-card"] .blog-title {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 30px;
        color: #1f160f;
        line-height: 1.25;
        margin-bottom: 26px;
      }
      [data-composition-id="01-url-to-card"] .blog-bar {
        background: #ece4d3;
        height: 12px;
        border-radius: 6px;
        margin-bottom: 14px;
      }
      [data-composition-id="01-url-to-card"] .bb1 { width: 92%; }
      [data-composition-id="01-url-to-card"] .bb2 { width: 84%; }
      [data-composition-id="01-url-to-card"] .bb3 { width: 70%; }
      [data-composition-id="01-url-to-card"] .bb4 { width: 86%; margin-top: 24px; }
      [data-composition-id="01-url-to-card"] .bb5 { width: 60%; }

      /* ---------- CENTER: bridge ---------- */
      [data-composition-id="01-url-to-card"] .bridge {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center;
        gap: 14px;
        opacity: 0;
        z-index: 6;
      }
      [data-composition-id="01-url-to-card"] .play-btn { width: 110px; height: 110px; }
      [data-composition-id="01-url-to-card"] .bridge-label {
        font-weight: 700; font-size: 18px;
        letter-spacing: 0.32em;
        color: #1f160f; opacity: 0.7;
      }

      /* ---------- RIGHT: dark recipe card ---------- */
      [data-composition-id="01-url-to-card"] .recipe-card {
        position: absolute;
        top: 60px; right: 100px;
        width: 720px; height: 960px;
        background: #231a14;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 14px 50px rgba(31,22,15,0.22);
        opacity: 0;
        transform: translateX(40px) scale(0.96);
        z-index: 5;
      }
      [data-composition-id="01-url-to-card"] .rc-header {
        margin-bottom: 16px;
      }
      [data-composition-id="01-url-to-card"] .rc-mark {
        font-weight: 700; font-size: 14px;
        letter-spacing: 0.18em;
        color: #f5a73a;
      }
      [data-composition-id="01-url-to-card"] .rc-photo {
        height: 280px;
        border-radius: 12px;
        background:
          radial-gradient(ellipse at 30% 40%, rgba(255,180,90,0.55) 0%, transparent 50%),
          radial-gradient(ellipse at 70% 60%, rgba(196,74,48,0.45) 0%, transparent 50%),
          radial-gradient(circle at 80% 30%, rgba(94,113,64,0.35) 0%, transparent 30%),
          radial-gradient(circle at 20% 80%, rgba(255,228,180,0.45) 0%, transparent 30%),
          linear-gradient(135deg, #c2784a 0%, #8e4f30 100%);
        margin-bottom: 22px;
        position: relative;
        overflow: hidden;
      }
      [data-composition-id="01-url-to-card"] .rc-photo-stand {
        position: absolute; inset: 0;
        background:
          radial-gradient(circle at 40% 50%, transparent 24%, rgba(0,0,0,0.18) 26%, transparent 28%),
          radial-gradient(circle at 60% 35%, transparent 14%, rgba(0,0,0,0.14) 16%, transparent 18%),
          radial-gradient(circle at 25% 70%, transparent 10%, rgba(94,113,64,0.6) 12%, transparent 14%);
      }
      [data-composition-id="01-url-to-card"] .steam {
        position: absolute;
        top: -180px; left: 50%;
        transform: translateX(-50%);
        width: 90px; height: 200px;
        opacity: 0;
        z-index: 4;
        pointer-events: none;
      }
      [data-composition-id="01-url-to-card"] .rc-title {
        font-family: "Instrument Serif", serif;
        font-size: 56px;
        color: #f8f1e4;
        line-height: 1.05;
        margin-bottom: 18px;
      }
      [data-composition-id="01-url-to-card"] .rc-pills {
        display: flex; gap: 10px;
        margin-bottom: 30px;
      }
      [data-composition-id="01-url-to-card"] .rc-pill {
        padding: 8px 18px;
        border-radius: 999px;
        font-weight: 600; font-size: 17px;
      }
      [data-composition-id="01-url-to-card"] .rc-pill-time   { background: rgba(196,74,48,0.20);  color: #ee8262; }
      [data-composition-id="01-url-to-card"] .rc-pill-serves { background: rgba(196,74,48,0.20);  color: #ee8262; }
      [data-composition-id="01-url-to-card"] .rc-pill-veg    { background: rgba(94,113,64,0.30);  color: #a4c170; }
      [data-composition-id="01-url-to-card"] .rc-ingredients {
        display: flex; flex-direction: column;
      }
      [data-composition-id="01-url-to-card"] .rc-ing {
        display: flex; justify-content: space-between;
        padding: 16px 0;
        border-bottom: 1px solid rgba(248,241,228,0.08);
        font-size: 22px;
        color: #f8f1e4;
        opacity: 0;
        transform: translateY(8px);
      }
      [data-composition-id="01-url-to-card"] .rc-ing-amt { color: #a8978a; }
      [data-composition-id="01-url-to-card"] .toast {
        position: absolute;
        bottom: -28px; left: 28px;
        background: #ffffff;
        border-radius: 14px;
        padding: 14px 22px;
        display: flex; align-items: center; gap: 14px;
        box-shadow: 0 10px 32px rgba(31,22,15,0.18);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
      }
      [data-composition-id="01-url-to-card"] .toast-check { width: 32px; height: 32px; }
      [data-composition-id="01-url-to-card"] .toast-line-1 {
        font-weight: 700; font-size: 18px; color: #1f160f; line-height: 1.1;
      }
      [data-composition-id="01-url-to-card"] .toast-line-2 {
        font-size: 14px; color: #a8978a; line-height: 1.1; margin-top: 2px;
      }

      [data-composition-id="01-url-to-card"] .page-sweep {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #f8f1e4;
        box-shadow: 18px 0 60px rgba(31,22,15,0.18);
        z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 7;
        const sel = (q) => `[data-composition-id="01-url-to-card"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        // Blog panel slides in faded
        tl.fromTo(sel('.blog-panel'),
          { x: -40, opacity: 0 },
          { x: 0, opacity: 0.55, duration: 0.70, ease: 'power3.out' }, 0.05);

        // Bridge fades in
        tl.fromTo(sel('.bridge'),
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.55);

        // Recipe card slides in with scale settle
        tl.fromTo(sel('.recipe-card'),
          { x: 40, scale: 0.96, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.85, ease: 'back.out(1.3)' }, 0.75);

        // Ingredients drop in row by row
        tl.to(sel('.rc-ing'),
          { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out', stagger: 0.18 }, 1.85);

        // Steam wisps draw in over the photo
        tl.to(sel('.steam'),
          { opacity: 1, duration: 0.30, ease: 'power2.out' }, 2.20);
        tl.to(sel('.steam path'),
          { strokeDashoffset: 0, duration: 1.40, ease: 'power2.inOut', stagger: 0.20 }, 2.20);
        // Continuous wave on steam — gentle bobbing
        tl.to(sel('.steam'),
          { y: -14, opacity: 0.7, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.40);

        // Slow zoom on the recipe photo to add life
        tl.to(sel('.rc-photo'),
          { scale: 1.04, duration: 4.0, ease: 'sine.inOut' }, 1.0);
        tl.to(sel('.rc-photo'),
          { scale: 1.0, duration: 0.35, ease: 'power2.in' }, 6.30);
        tl.set(sel('.rc-photo'), { transformOrigin: '50% 50%' }, 0);

        // Subtle hover/breathe on the dark recipe card
        tl.to(sel('.recipe-card'),
          { y: -6, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.20);

        // Toast pulses in at ~3.0s into the beat
        tl.to(sel('.toast'),
          { y: 0, scale: 1, opacity: 1, duration: 0.50, ease: 'back.out(1.6)' }, 3.10);
        // Toast holds, then fades
        tl.to(sel('.toast'),
          { opacity: 0, y: -6, duration: 0.40, ease: 'power2.in' }, 5.00);

        // Slow drift for breathing room on hold
        tl.to([sel('.blog-panel'), sel('.recipe-card')],
          { y: -6, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.20);

        // Page-sweep exit
        tl.fromTo(sel('.page-sweep'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.50, ease: 'power2.inOut' }, 6.50);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['01-url-to-card'] = tl;
      })();
    </script>
  </div>
</template>
