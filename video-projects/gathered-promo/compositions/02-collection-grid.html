<template id="02-collection-grid-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="02-collection-grid" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="paper-grain"></div>

      <div class="eyebrow-pill">
        <span class="sparkle">✦</span>
        <span class="eyebrow-text">100+&nbsp;CHEF-CURATED&nbsp;RECIPES&nbsp;INSIDE</span>
      </div>

      <div class="grid">
        <div class="r-card r1">
          <div class="r-photo" data-photo-slot="tuscan-chicken"
               style="background:
                 radial-gradient(circle at 35% 40%, rgba(255,200,80,0.6), transparent 38%),
                 radial-gradient(circle at 70% 55%, rgba(196,74,48,0.55), transparent 35%),
                 radial-gradient(circle at 50% 70%, rgba(94,113,64,0.45), transparent 30%),
                 linear-gradient(135deg, #c08858 0%, #8a5530 100%);"></div>
          <div class="r-meta">
            <div class="r-title">Tuscan Chicken</div>
            <div class="r-author">by Gina Homolka</div>
          </div>
        </div>
        <div class="r-card r2">
          <div class="r-photo" data-photo-slot="honey-garlic-salmon"
               style="background:
                 radial-gradient(circle at 40% 50%, rgba(245,167,58,0.65), transparent 40%),
                 radial-gradient(circle at 65% 45%, rgba(255,170,140,0.55), transparent 35%),
                 radial-gradient(circle at 50% 80%, rgba(94,113,64,0.45), transparent 25%),
                 linear-gradient(135deg, #d68e6a 0%, #9b5a3a 100%);"></div>
          <div class="r-meta">
            <div class="r-title">Honey Garlic Salmon</div>
            <div class="r-author">by Tieghan Gerard</div>
          </div>
        </div>
        <div class="r-card r3">
          <div class="r-photo" data-photo-slot="buddha-bowl"
               style="background:
                 radial-gradient(circle at 30% 40%, rgba(94,113,64,0.7), transparent 30%),
                 radial-gradient(circle at 65% 35%, rgba(196,74,48,0.5), transparent 25%),
                 radial-gradient(circle at 70% 65%, rgba(245,167,58,0.55), transparent 28%),
                 radial-gradient(circle at 35% 70%, rgba(160,80,140,0.4), transparent 28%),
                 linear-gradient(135deg, #b6a97a 0%, #6e5c3a 100%);"></div>
          <div class="r-meta">
            <div class="r-title">Buddha Bowl</div>
            <div class="r-author">by Erin Clarke</div>
          </div>
        </div>
        <div class="r-card r4">
          <div class="r-photo" data-photo-slot="sheet-pan-fajitas"
               style="background:
                 radial-gradient(circle at 35% 40%, rgba(196,74,48,0.7), transparent 35%),
                 radial-gradient(circle at 65% 60%, rgba(94,113,64,0.55), transparent 32%),
                 radial-gradient(circle at 50% 30%, rgba(245,167,58,0.5), transparent 25%),
                 linear-gradient(135deg, #b85a3a 0%, #6a3424 100%);"></div>
          <div class="r-meta">
            <div class="r-title">Sheet Pan Fajitas</div>
            <div class="r-author">by Alex Snodgrass</div>
          </div>
        </div>
      </div>

      <div class="toast">
        <svg viewBox="0 0 24 24" fill="none" class="toast-check">
          <circle cx="12" cy="12" r="10" fill="#5e7140"/>
          <path d="M 7 12.5 L 10.5 16 L 17 9" stroke="#f8f1e4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="toast-text">
          <div class="toast-line-1">Recipe Saved!</div>
          <div class="toast-line-2">Added to To Try</div>
        </div>
      </div>

      <div class="page-sweep"></div>
    </div>

    <style>
      [data-composition-id="02-collection-grid"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #f8f1e4;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="02-collection-grid"] .stage { position: absolute; inset: 0; }
      [data-composition-id="02-collection-grid"] .paper-grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.10;
        background-image:
          radial-gradient(rgba(31,22,15,0.30) 1px, transparent 1px),
          radial-gradient(rgba(31,22,15,0.20) 1px, transparent 1px);
        background-size: 4px 4px, 7px 7px;
        background-position: 0 0, 2px 3px;
        z-index: 2;
      }

      [data-composition-id="02-collection-grid"] .eyebrow-pill {
        position: absolute;
        top: 64px; left: 50%;
        transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px;
        padding: 12px 26px;
        background: #fde4d3;
        border-radius: 999px;
        opacity: 0;
        z-index: 4;
      }
      [data-composition-id="02-collection-grid"] .sparkle {
        font-size: 16px; color: #c44a30;
      }
      [data-composition-id="02-collection-grid"] .eyebrow-text {
        font-weight: 700; font-size: 16px;
        letter-spacing: 0.18em; color: #c44a30;
      }

      [data-composition-id="02-collection-grid"] .grid {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(2, 480px);
        grid-template-rows: repeat(2, 380px);
        gap: 28px;
      }
      [data-composition-id="02-collection-grid"] .r-card {
        background: #ffffff;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(31,22,15,0.06);
        opacity: 0;
        transform: translateY(40px);
      }
      [data-composition-id="02-collection-grid"] .r-photo {
        height: 270px;
        position: relative;
      }
      [data-composition-id="02-collection-grid"] .r-meta {
        padding: 18px 22px;
      }
      [data-composition-id="02-collection-grid"] .r-title {
        font-family: "Instrument Serif", serif;
        font-size: 30px;
        color: #1f160f;
        line-height: 1.1;
      }
      [data-composition-id="02-collection-grid"] .r-author {
        font-size: 16px;
        color: #a8978a;
        margin-top: 4px;
      }

      [data-composition-id="02-collection-grid"] .toast {
        position: absolute;
        bottom: 80px; left: 100px;
        background: #ffffff;
        border-radius: 14px;
        padding: 14px 22px;
        display: flex; align-items: center; gap: 14px;
        box-shadow: 0 10px 32px rgba(31,22,15,0.18);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        z-index: 5;
      }
      [data-composition-id="02-collection-grid"] .toast-check { width: 32px; height: 32px; }
      [data-composition-id="02-collection-grid"] .toast-line-1 {
        font-weight: 700; font-size: 18px; color: #1f160f; line-height: 1.1;
      }
      [data-composition-id="02-collection-grid"] .toast-line-2 {
        font-size: 14px; color: #a8978a; line-height: 1.1; margin-top: 2px;
      }

      [data-composition-id="02-collection-grid"] .page-sweep {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #f8f1e4;
        box-shadow: 18px 0 60px rgba(31,22,15,0.18);
        z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 5;
        const sel = (q) => `[data-composition-id="02-collection-grid"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.eyebrow-pill'),
          { y: -6, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.10);

        tl.to(sel('.r-card'),
          { y: 0, opacity: 1, duration: 0.65, ease: 'back.out(1.2)', stagger: 0.18 }, 0.45);

        // Subtle breathing while held
        tl.to(sel('.grid'),
          { scale: 1.012, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.0);

        // Toast pulses
        tl.to(sel('.toast'),
          { y: 0, scale: 1, opacity: 1, duration: 0.50, ease: 'back.out(1.6)' }, 3.20);
        tl.to(sel('.toast'),
          { opacity: 0, y: -6, duration: 0.40, ease: 'power2.in' }, 4.20);

        tl.fromTo(sel('.page-sweep'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.50, ease: 'power2.inOut' }, 4.50);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['02-collection-grid'] = tl;
      })();
    </script>
  </div>
</template>
