<template id="00-cold-open-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="00-cold-open" data-start="0" data-duration="4" data-width="1080" data-height="1080">
    <div class="stage">
      <div class="paper-grain"></div>

      <div class="masthead">
        <span class="mark-name">Gathered</span>
        <span class="mark-divider">·</span>
        <span class="mark-tagline">RECIPE&nbsp;COMPANION</span>
      </div>

      <svg class="sprig" viewBox="0 0 200 80" fill="none">
        <path d="M 20 40 Q 100 20 180 40" stroke="#5e7140" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
        <path d="M 60 36 Q 60 26 70 22 Q 78 32 70 40 Z" fill="#5e7140" opacity="0.55"/>
        <path d="M 100 32 Q 102 22 112 18 Q 118 28 110 36 Z" fill="#5e7140" opacity="0.55"/>
        <path d="M 140 36 Q 142 26 152 22 Q 158 32 150 40 Z" fill="#5e7140" opacity="0.55"/>
      </svg>

      <div class="hero">
        <div class="line line-1">All the recipes.</div>
        <div class="line line-2">None of the noise.</div>
      </div>

      <div class="page-sweep"></div>
    </div>

    <style>
      [data-composition-id="00-cold-open"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #f8f1e4;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="00-cold-open"] .stage { position: absolute; inset: 0; }
      [data-composition-id="00-cold-open"] .paper-grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.12;
        background-image:
          radial-gradient(rgba(31,22,15,0.35) 1px, transparent 1px),
          radial-gradient(rgba(31,22,15,0.25) 1px, transparent 1px);
        background-size: 4px 4px, 7px 7px;
        background-position: 0 0, 2px 3px;
        mix-blend-mode: multiply;
        z-index: 2;
      }
      [data-composition-id="00-cold-open"] .masthead {
        position: absolute;
        top: 56px; left: 50%;
        transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px;
        opacity: 0;
        z-index: 5;
      }
      [data-composition-id="00-cold-open"] .mark-name {
        font-family: "Instrument Serif", serif;
        font-size: 32px;
        color: #1f160f;
      }
      [data-composition-id="00-cold-open"] .mark-divider { color: #f5a73a; font-size: 18px; }
      [data-composition-id="00-cold-open"] .mark-tagline {
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.32em;
        color: #1f160f;
        opacity: 0.7;
      }
      [data-composition-id="00-cold-open"] .sprig {
        position: absolute;
        bottom: 14%; right: 14%;
        width: 240px; height: 96px;
        opacity: 0;
        transform: rotate(-12deg);
        z-index: 3;
      }
      [data-composition-id="00-cold-open"] .hero {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 4;
      }
      [data-composition-id="00-cold-open"] .line {
        font-family: "Instrument Serif", serif;
        font-size: 96px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        opacity: 0;
      }
      [data-composition-id="00-cold-open"] .line-1 { color: #1f160f; margin-bottom: 6px; }
      [data-composition-id="00-cold-open"] .line-2 {
        color: #c44a30;
        font-style: italic;
      }
      [data-composition-id="00-cold-open"] .page-sweep {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #f8f1e4;
        box-shadow: 18px 0 60px rgba(31,22,15,0.18);
        z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 4;
        const sel = (q) => `[data-composition-id="00-cold-open"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.masthead'),
          { y: -10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.10);

        tl.fromTo(sel('.sprig'),
          { x: 40, y: 20, opacity: 0, rotation: -16 },
          { x: 0, y: 0, opacity: 1, rotation: -12, duration: 1.6, ease: 'power2.out' }, 0.30);

        tl.fromTo(sel('.line-1'),
          { y: 14, opacity: 0, filter: 'blur(6px)' },
          { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.85, ease: 'power2.out' }, 0.45);

        tl.fromTo(sel('.line-2'),
          { y: 14, opacity: 0, filter: 'blur(6px)' },
          { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.85, ease: 'power2.out' }, 1.40);

        tl.to(sel('.hero'),
          { y: -8, duration: 1.0, ease: 'sine.inOut' }, 2.40);

        tl.fromTo(sel('.page-sweep'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.50, ease: 'power2.inOut' }, 3.50);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['00-cold-open'] = tl;
      })();
    </script>
  </div>
</template>
