<template id="01-walk-out-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="01-walk-out" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="grid-floor"></div>

      <!-- Clean system diagram -->
      <svg class="system-diagram" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#f9a72c"/>
          </marker>
        </defs>
        <!-- Three nodes -->
        <circle class="node n1" cx="100" cy="140" r="38" fill="rgba(249,167,44,0.10)" stroke="#f9a72c" stroke-width="2.5"/>
        <circle class="node n2" cx="400" cy="140" r="38" fill="rgba(249,167,44,0.10)" stroke="#f9a72c" stroke-width="2.5"/>
        <circle class="node n3" cx="700" cy="140" r="38" fill="rgba(249,167,44,0.10)" stroke="#f9a72c" stroke-width="2.5"/>
        <!-- Connector lines -->
        <line class="conn c1" x1="138" y1="140" x2="354" y2="140"
              stroke="#f9a72c" stroke-width="2.5" stroke-dasharray="220" stroke-dashoffset="220"
              marker-end="url(#arrow-out)"/>
        <line class="conn c2" x1="438" y1="140" x2="654" y2="140"
              stroke="#f9a72c" stroke-width="2.5" stroke-dasharray="220" stroke-dashoffset="220"
              marker-end="url(#arrow-out)"/>
        <!-- Inner glyphs -->
        <text class="glyph" x="100" y="148" text-anchor="middle" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#f9a72c">CTX</text>
        <text class="glyph" x="400" y="148" text-anchor="middle" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#f9a72c">SKILL</text>
        <text class="glyph" x="700" y="148" text-anchor="middle" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#f9a72c">OUT</text>
      </svg>

      <div class="hero">
        <div class="eyebrow">90 MINUTES LATER</div>
        <div class="line" data-split>WALK OUT WITH</div>
        <div class="line-hero" data-split>A SYSTEM.</div>
      </div>

      <div class="whip-streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="01-walk-out"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c; font-family: "Inter", sans-serif;
      }
      [data-composition-id="01-walk-out"] .stage { position: absolute; inset: 0; }
      [data-composition-id="01-walk-out"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.06) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.06) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="01-walk-out"] .system-diagram {
        position: absolute; top: 78%; left: 50%;
        transform: translate(-50%, -50%);
        width: 800px; height: 280px;
        opacity: 0;
        filter: drop-shadow(0 0 28px rgba(249,167,44,0.20));
      }
      [data-composition-id="01-walk-out"] .node { opacity: 0; transform-origin: center; }
      [data-composition-id="01-walk-out"] .glyph { opacity: 0; }
      [data-composition-id="01-walk-out"] .hero {
        position: absolute; top: 28%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      [data-composition-id="01-walk-out"] .eyebrow {
        font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 24px; letter-spacing: 0.38em;
        color: #f9a72c; opacity: 0;
        text-shadow: 0 0 14px rgba(249,167,44,0.40);
        margin-bottom: 22px;
      }
      [data-composition-id="01-walk-out"] .line {
        font-weight: 800; font-size: 100px;
        letter-spacing: -0.022em; line-height: 1.0;
        color: rgba(255,255,255,0.92);
        white-space: nowrap;
      }
      [data-composition-id="01-walk-out"] .line-hero {
        font-weight: 800; font-size: 200px;
        letter-spacing: -0.03em; line-height: 0.96;
        color: #f9a72c;
        text-shadow: 0 0 36px rgba(249,167,44,0.80), 0 0 90px rgba(249,167,44,0.35);
        white-space: nowrap;
        margin-top: 4px;
      }
      [data-composition-id="01-walk-out"] .line .word,
      [data-composition-id="01-walk-out"] .line-hero .word { display: inline-block; white-space: nowrap; }
      [data-composition-id="01-walk-out"] .line .ch,
      [data-composition-id="01-walk-out"] .line-hero .ch {
        display: inline-block; opacity: 0; transform: translateY(40px);
        will-change: opacity, transform;
      }
      [data-composition-id="01-walk-out"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 28%, rgba(0,0,0,0.92) 95%);
        opacity: 0.65;
      }
      [data-composition-id="01-walk-out"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
        background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 3px 3px;
      }
      [data-composition-id="01-walk-out"] .whip-streak {
        position: absolute; top: 50%; left: 0;
        width: 70%; height: 14px;
        background: linear-gradient(90deg, transparent 0%, rgba(249,167,44,0.95) 50%, transparent 100%);
        filter: blur(10px); transform: translate(-150%, -50%);
        opacity: 0; z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3.5;
        const sel = (q) => `[data-composition-id="01-walk-out"] ${q}`;

        document.querySelectorAll(sel('[data-split]')).forEach((node) => {
          const words = node.textContent.split(' ');
          node.innerHTML = words.map((w) =>
            `<span class="word">${w.split('').map((c) => `<span class="ch">${c}</span>`).join('')}</span>`
          ).join(' ');
        });

        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'), { backgroundPositionY: '-60px', duration: SLOT, ease: 'none' }, 0);

        // Hero land
        tl.fromTo(sel('.eyebrow'), { y: -6, opacity: 0 }, { y: 0, opacity: 0.92, duration: 0.35, ease: 'power3.out' }, 0.05);
        tl.to(sel('.line .ch'), { y: 0, opacity: 1, duration: 0.40, ease: 'power3.out', stagger: 0.018 }, 0.20);
        tl.to(sel('.line-hero .ch'), { y: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.7)', stagger: 0.028 }, 0.70);

        // System diagram materializes
        tl.to(sel('.system-diagram'), { opacity: 1, duration: 0.40, ease: 'power2.out' }, 1.30);
        tl.fromTo(sel('.node'),
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.40, ease: 'back.out(1.7)',
            stagger: 0.12, transformOrigin: 'center' }, 1.40);
        tl.to(sel('.glyph'),
          { opacity: 1, duration: 0.30, ease: 'power2.out', stagger: 0.12 }, 1.55);
        tl.to(sel('.conn.c1'),
          { strokeDashoffset: 0, duration: 0.40, ease: 'power2.out' }, 1.60);
        tl.to(sel('.conn.c2'),
          { strokeDashoffset: 0, duration: 0.40, ease: 'power2.out' }, 1.85);

        // Whip exit
        tl.set(sel('.whip-streak'), { opacity: 1 }, 3.12);
        tl.fromTo(sel('.whip-streak'),
          { xPercent: -150, scaleX: 0.5 },
          { xPercent: 250, scaleX: 1.5, duration: 0.38, ease: 'power3.in' }, 3.12);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['01-walk-out'] = tl;
      })();
    </script>
  </div>
</template>
