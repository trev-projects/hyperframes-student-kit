<template id="02-takeaways-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="02-takeaways" data-start="0" data-duration="3" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="grid-floor"></div>

      <div class="eyebrow">YOU LEAVE WITH</div>

      <div class="list">
        <div class="item">
          <span class="num">01</span>
          <span class="text">Working AI setup, your business context loaded in</span>
        </div>
        <div class="item">
          <span class="num">02</span>
          <span class="text">Skills + agents framework tailored to your workflows</span>
        </div>
        <div class="item">
          <span class="num">03</span>
          <span class="text">A repeatable system for writing, research, and execution</span>
        </div>
        <div class="item">
          <span class="num">04</span>
          <span class="text">A clear picture of which tools are worth paying for</span>
        </div>
        <div class="item">
          <span class="num">05</span>
          <span class="text">Starter prompts you can take home and use this week</span>
        </div>
      </div>

      <div class="whip-streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="02-takeaways"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c; font-family: "Inter", sans-serif;
      }
      [data-composition-id="02-takeaways"] .stage { position: absolute; inset: 0; }
      [data-composition-id="02-takeaways"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.05) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.05) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="02-takeaways"] .eyebrow {
        position: absolute; top: 100px; left: 50%;
        transform: translateX(-50%);
        font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 28px; letter-spacing: 0.40em;
        color: #f9a72c; opacity: 0;
        text-shadow: 0 0 14px rgba(249,167,44,0.40);
      }
      [data-composition-id="02-takeaways"] .list {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -45%);
        display: flex; flex-direction: column; gap: 22px;
        width: 1400px;
      }
      [data-composition-id="02-takeaways"] .item {
        display: flex; align-items: baseline; gap: 36px;
        padding: 14px 0;
        border-bottom: 1px solid rgba(249,167,44,0.18);
        opacity: 0; transform: translateX(-30px);
      }
      [data-composition-id="02-takeaways"] .item:last-child { border-bottom: none; }
      [data-composition-id="02-takeaways"] .num {
        flex: 0 0 96px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700; font-size: 40px;
        color: #3de0a6;
        letter-spacing: 0.05em;
        text-shadow: 0 0 14px rgba(61,224,166,0.45);
      }
      [data-composition-id="02-takeaways"] .text {
        font-weight: 600; font-size: 36px;
        color: rgba(255,255,255,0.92);
        letter-spacing: -0.005em;
        line-height: 1.1;
      }
      [data-composition-id="02-takeaways"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.90) 95%);
        opacity: 0.62;
      }
      [data-composition-id="02-takeaways"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
        background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 3px 3px;
      }
      [data-composition-id="02-takeaways"] .whip-streak {
        position: absolute; top: 50%; left: 0;
        width: 70%; height: 14px;
        background: linear-gradient(90deg, transparent 0%, rgba(249,167,44,0.95) 50%, transparent 100%);
        filter: blur(10px); transform: translate(-150%, -50%);
        opacity: 0; z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3;
        const sel = (q) => `[data-composition-id="02-takeaways"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'), { backgroundPositionY: '-60px', duration: SLOT, ease: 'none' }, 0);

        tl.fromTo(sel('.eyebrow'),
          { y: -8, opacity: 0 },
          { y: 0, opacity: 0.95, duration: 0.35, ease: 'power3.out' }, 0.05);

        // Items cascade in
        tl.to(sel('.item'),
          { x: 0, opacity: 1, duration: 0.40, ease: 'power3.out', stagger: 0.18 }, 0.20);

        // Whip exit
        tl.set(sel('.whip-streak'), { opacity: 1 }, 2.62);
        tl.fromTo(sel('.whip-streak'),
          { xPercent: -150, scaleX: 0.5 },
          { xPercent: 250, scaleX: 1.5, duration: 0.38, ease: 'power3.in' }, 2.62);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['02-takeaways'] = tl;
      })();
    </script>
  </div>
</template>
