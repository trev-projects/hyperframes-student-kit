<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Digiwell — TTW Workshop (Outcome)</title>
    <script src="assets/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07080c; color: #fff; }
      .beat-layer { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="digiwell-ttw-outcome" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="beat-layer"
        data-composition-id="00-walk-in"
        data-composition-src="compositions/00-walk-in.html"
        data-start="0" data-duration="3" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <div class="beat-layer"
        data-composition-id="01-walk-out"
        data-composition-src="compositions/01-walk-out.html"
        data-start="3" data-duration="3.5" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <div class="beat-layer"
        data-composition-id="02-takeaways"
        data-composition-src="compositions/02-takeaways.html"
        data-start="6.5" data-duration="3" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <div class="beat-layer"
        data-composition-id="03-cta"
        data-composition-src="compositions/03-cta.html"
        data-start="9.5" data-duration="2.5" data-track-index="0"
        data-width="1920" data-height="1080"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 12 }, 0);
      window.__timelines["digiwell-ttw-outcome"] = tl;
    </script>
  </body>
</html>
