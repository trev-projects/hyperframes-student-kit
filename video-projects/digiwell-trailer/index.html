<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Digiwell — Evergreen Trailer</title>
    <script src="assets/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: #07080c;
        color: #fff;
      }
      .beat-layer {
        position: absolute; top: 0; left: 0;
        width: 1920px; height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="digiwell-trailer"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Beat 00 — Cold open "GROWTH IS A SYSTEM." (0–4.5s) -->
      <div class="beat-layer"
        data-composition-id="00-cold-open"
        data-composition-src="compositions/00-cold-open.html"
        data-start="0" data-duration="4.5" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <!-- Beat 01 — Thesis "MOST AGENCIES POST. WE ENGINEER GROWTH." (4.5–9.5s) -->
      <div class="beat-layer"
        data-composition-id="01-thesis"
        data-composition-src="compositions/01-thesis.html"
        data-start="4.5" data-duration="5" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <!-- Beat 02 — The growth system: 3 fused service+result cards (9.5–18s) -->
      <div class="beat-layer"
        data-composition-id="02-system"
        data-composition-src="compositions/02-system.html"
        data-start="9.5" data-duration="8.5" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <!-- Beat 03 — Bridge "When the system runs, the numbers follow." (18–22.5s) -->
      <div class="beat-layer"
        data-composition-id="03-bridge"
        data-composition-src="compositions/03-bridge.html"
        data-start="18" data-duration="4.5" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <!-- Beat 04 — CTA hold (22.5–30s) -->
      <div class="beat-layer"
        data-composition-id="04-cta"
        data-composition-src="compositions/04-cta.html"
        data-start="22.5" data-duration="7.5" data-track-index="0"
        data-width="1920" data-height="1080"></div>

      <!-- Background music bed — warm-electronic, full runtime -->
      <audio id="bed"
        data-start="0" data-duration="30" data-track-index="20" data-volume="0.55"
        src="assets/music.wav"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 30 }, 0);
      window.__timelines["digiwell-trailer"] = tl;
    </script>
  </body>
</html>
