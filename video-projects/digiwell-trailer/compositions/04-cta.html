<template id="04-cta-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="04-cta" data-start="0" data-duration="7.5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="grid-floor"></div>
      <div class="swirl">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
      </div>
      <div class="particles" id="particles-cta"></div>

      <div class="cta">
        <div class="pill">FREE&nbsp;AUDIT</div>
        <div class="wordmark">
          <span class="word-text">Digiwell</span>
          <div class="shimmer"></div>
        </div>
        <div class="tagline">MARKETING</div>
        <div class="url">digiwellmarketing.com</div>
        <div class="button">
          <span class="button-label">Get Your Audit Preview</span>
          <span class="button-arrow">&rarr;</span>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="04-cta"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="04-cta"] .stage { position: absolute; inset: 0; }
      [data-composition-id="04-cta"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.05) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.05) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="04-cta"] .swirl {
        position: absolute; top: 50%; left: 50%;
        width: 1600px; height: 1600px;
        transform: translate(-50%, -50%);
      }
      [data-composition-id="04-cta"] .ring {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px dashed rgba(249,167,44,0.16);
      }
      [data-composition-id="04-cta"] .r1 { width: 700px;  height: 700px; }
      [data-composition-id="04-cta"] .r2 { width: 1050px; height: 1050px; border-color: rgba(249,167,44,0.10); }
      [data-composition-id="04-cta"] .r3 { width: 1450px; height: 1450px; border-color: rgba(249,167,44,0.06); }
      [data-composition-id="04-cta"] .particles {
        position: absolute; top: 50%; left: 50%;
        width: 1600px; height: 1600px;
        transform: translate(-50%, -50%);
      }
      [data-composition-id="04-cta"] .particle {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd480 0%, #f9a72c 40%, transparent 75%);
        filter: blur(1px);
        opacity: 0;
      }
      [data-composition-id="04-cta"] .cta {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 0;
      }
      [data-composition-id="04-cta"] .pill {
        padding: 10px 28px;
        border: 1px solid rgba(249,167,44,0.6);
        border-radius: 999px;
        background: rgba(249,167,44,0.08);
        color: #f9a72c;
        font-weight: 600;
        font-size: 22px;
        letter-spacing: 0.32em;
        margin-bottom: 28px;
        text-shadow: 0 0 16px rgba(249,167,44,0.6);
        box-shadow: 0 0 32px rgba(249,167,44,0.25);
        opacity: 0;
      }
      [data-composition-id="04-cta"] .wordmark {
        position: relative;
        display: inline-block;
        font-weight: 800;
        font-size: 240px;
        letter-spacing: -0.035em;
        line-height: 1;
        background: linear-gradient(180deg, #ffffff 0%, #f7d99a 55%, #f9a72c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 50px rgba(249,167,44,0.55);
        overflow: hidden;
        opacity: 0;
      }
      [data-composition-id="04-cta"] .shimmer {
        position: absolute; top: 0; left: -40%;
        width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.65) 50%, transparent 100%);
        filter: blur(12px);
        mix-blend-mode: screen;
        pointer-events: none;
      }
      [data-composition-id="04-cta"] .tagline {
        margin-top: 4px;
        font-weight: 600;
        font-size: 56px;
        letter-spacing: 0.44em;
        color: #f9a72c;
        opacity: 0;
        text-shadow: 0 0 18px rgba(249,167,44,0.35);
      }
      [data-composition-id="04-cta"] .url {
        margin-top: 36px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 42px;
        letter-spacing: 0.04em;
        color: #f9a72c;
        opacity: 0;
        text-shadow: 0 0 16px rgba(249,167,44,0.35);
      }
      [data-composition-id="04-cta"] .button {
        margin-top: 28px;
        padding: 16px 36px;
        background: linear-gradient(180deg, #ffba5a 0%, #f9a72c 55%, #e0881c 100%);
        color: #1a1208;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.02em;
        border-radius: 999px;
        display: flex; gap: 14px; align-items: center;
        box-shadow:
          0 0 40px rgba(249,167,44,0.5),
          inset 0 1px 0 rgba(255,255,255,0.5);
        opacity: 0;
      }
      [data-composition-id="04-cta"] .button-arrow { font-size: 28px; font-weight: 800; }

      [data-composition-id="04-cta"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 95%);
        opacity: 0.70;
      }
      [data-composition-id="04-cta"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.08;
        background-image:
          radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
      }
    </style>

    <script>
      (() => {
        const SLOT = 7.5;
        const sel = (q) => `[data-composition-id="04-cta"] ${q}`;

        // Denser particle cloud than Beat 0
        const root = document.querySelector(sel('.particles'));
        const N = 90;
        for (let i = 0; i < N; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          const angle = (i * 137.5) * Math.PI / 180;
          const r = 240 + 520 * Math.abs(Math.sin(i * 0.41 + 0.9));
          const cx = 800 + Math.cos(angle) * r;
          const cy = 800 + Math.sin(angle) * r * 0.58;
          const size = 4 + 7 * Math.abs(Math.cos(i * 0.87));
          p.style.left = (cx - size / 2) + 'px';
          p.style.top  = (cy - size / 2) + 'px';
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          root.appendChild(p);
        }

        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'),
          { backgroundPositionY: '-100px', duration: SLOT, ease: 'none' }, 0);

        tl.to(sel('.swirl'),
          { rotation: 60, duration: SLOT, ease: 'none', transformOrigin: '50% 50%' }, 0);
        tl.to(sel('.particles'),
          { rotation: -40, duration: SLOT, ease: 'none', transformOrigin: '50% 50%' }, 0);

        tl.to(sel('.particle'),
          { opacity: 1, duration: 0.8, ease: 'power2.out',
            stagger: { each: 0.010, from: 'center' } }, 0);

        // Pill in
        tl.fromTo(sel('.pill'),
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.4)' }, 0.10);

        // Wordmark in (scale settle)
        tl.fromTo(sel('.wordmark'),
          { opacity: 0, scale: 0.95 },
          { opacity: 1, scale: 1, duration: 0.80, ease: 'power3.out' }, 0.25);

        // Tagline
        tl.fromTo(sel('.tagline'),
          { opacity: 0, y: 8 },
          { opacity: 0.85, y: 0, duration: 0.60, ease: 'power3.out' }, 0.95);

        // URL
        tl.fromTo(sel('.url'),
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 1.40);

        // Button
        tl.fromTo(sel('.button'),
          { opacity: 0, y: 12, scale: 0.95 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.4)' }, 1.75);

        // Shimmer sweep at t≈3.0s
        tl.fromTo(sel('.shimmer'),
          { left: '-40%' },
          { left: '100%', duration: 0.9, ease: 'power2.inOut' }, 3.00);

        // Continuous breathing pulse on the button through the rest of the hold
        tl.to(sel('.button'),
          { scale: 1.04, boxShadow: '0 0 60px rgba(249,167,44,0.75), inset 0 1px 0 rgba(255,255,255,0.5)',
            duration: 0.7, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 3.60);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['04-cta'] = tl;
      })();
    </script>
  </div>
</template>
