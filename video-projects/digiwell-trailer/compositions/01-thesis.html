<template id="01-thesis-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet" />

  <div data-composition-id="01-thesis" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="grid-floor"></div>

      <div class="stack">
        <div class="ln ln1" data-split>MOST AGENCIES</div>
        <div class="ln ln2" data-split>POST.</div>
        <div class="ln ln3a" data-split>WE ENGINEER</div>
        <div class="ln ln3b" data-split>GROWTH.</div>
        <div class="ln3-underline"></div>
      </div>

      <div class="whip-streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="01-thesis"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="01-thesis"] .stage { position: absolute; inset: 0; }
      [data-composition-id="01-thesis"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.06) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.06) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="01-thesis"] .stack {
        position: absolute;
        top: 50%; left: 100px;
        transform: translateY(-50%);
        display: flex; flex-direction: column;
        gap: 0;
      }
      [data-composition-id="01-thesis"] .ln {
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 0.98;
      }
      [data-composition-id="01-thesis"] .ln1 {
        font-size: 140px;
        color: #ffffff;
        opacity: 0;
      }
      [data-composition-id="01-thesis"] .ln2 {
        font-size: 140px;
        color: #ffffff;
        opacity: 0;
      }
      [data-composition-id="01-thesis"] .ln3a {
        font-size: 156px;
        color: #f9a72c;
        opacity: 0.92;
        text-shadow:
          0 0 22px rgba(249,167,44,0.55),
          0 0 60px rgba(249,167,44,0.22);
        margin-top: 14px;
        white-space: nowrap;
      }
      [data-composition-id="01-thesis"] .ln3b {
        font-size: 220px;
        color: #f9a72c;
        text-shadow:
          0 0 32px rgba(249,167,44,0.85),
          0 0 80px rgba(249,167,44,0.35);
        white-space: nowrap;
        margin-top: -6px;
      }
      [data-composition-id="01-thesis"] .ln .word {
        display: inline-block;
        white-space: nowrap;
      }
      [data-composition-id="01-thesis"] .ln .ch {
        display: inline-block;
        opacity: 0;
        transform: translateY(40px);
        will-change: opacity, transform;
      }
      [data-composition-id="01-thesis"] .ln3-underline {
        margin-top: 16px;
        height: 6px;
        width: 100%;
        background: #f9a72c;
        box-shadow: 0 0 18px rgba(249,167,44,0.65);
        transform: scaleX(0);
        transform-origin: left center;
      }

      [data-composition-id="01-thesis"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 95%);
        opacity: 0.75;
      }
      [data-composition-id="01-thesis"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.08;
        background-image:
          radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
      }
      [data-composition-id="01-thesis"] .whip-streak {
        position: absolute; top: 50%; left: 0;
        width: 70%; height: 14px;
        background: linear-gradient(90deg, transparent 0%, rgba(249,167,44,0.95) 50%, transparent 100%);
        filter: blur(10px);
        transform: translate(-150%, -50%);
        opacity: 0; z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 5;
        const sel = (q) => `[data-composition-id="01-thesis"] ${q}`;

        // Word-safe split — words are inline-block units so they never break mid-word
        document.querySelectorAll(sel('[data-split]')).forEach((node) => {
          const text = node.textContent;
          const words = text.split(' ');
          node.innerHTML = words.map((word) => {
            const chars = word.split('').map((c) => `<span class="ch">${c}</span>`).join('');
            return `<span class="word">${chars}</span>`;
          }).join(' ');
        });

        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'),
          { backgroundPositionY: '-90px', duration: SLOT, ease: 'none' }, 0);

        // Line 1
        tl.fromTo(sel('.ln1'), { opacity: 0 }, { opacity: 0.92, duration: 0.05 }, 0.10);
        tl.to(sel('.ln1 .ch'),
          { y: 0, opacity: 1, duration: 0.40, ease: 'back.out(1.4)', stagger: 0.020 }, 0.10);

        // Line 2 — "POST." downbeat, fades to lower opacity
        tl.fromTo(sel('.ln2'), { opacity: 0 }, { opacity: 0.55, duration: 0.05 }, 0.65);
        tl.to(sel('.ln2 .ch'),
          { y: 0, opacity: 0.55, duration: 0.32, ease: 'power3.out', stagger: 0.020 }, 0.65);

        // Line 3a — "WE ENGINEER" (mid-punch)
        tl.to(sel('.ln3a .ch'),
          { y: 0, opacity: 0.92, duration: 0.42, ease: 'power3.out', stagger: 0.020 }, 1.20);

        // Line 3b — "GROWTH." (max punch, hard land)
        tl.to(sel('.ln3b .ch'),
          { y: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.7)', stagger: 0.030 }, 1.70);

        // Underline draws under "GROWTH."
        tl.to(sel('.ln3-underline'),
          { scaleX: 1, duration: 0.65, ease: 'power3.out' }, 2.50);

        // Hold ~1.5s
        tl.set({}, {}, 4.20);

        // Whip-streak exit
        tl.set(sel('.whip-streak'), { opacity: 1 }, 4.55);
        tl.fromTo(sel('.whip-streak'),
          { xPercent: -150, scaleX: 0.5 },
          { xPercent: 250, scaleX: 1.5, duration: 0.40, ease: 'power3.in' }, 4.55);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['01-thesis'] = tl;
      })();
    </script>
  </div>
</template>
