<template id="01-on-ai-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="01-on-ai" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="grid-floor"></div>

      <div class="halo"></div>

      <div class="hero">
        <div class="line" data-split>ON AI.</div>
        <div class="underline"></div>
        <div class="sub-line">Trevor Davis</div>
        <div class="sub-tag">FRACTIONAL AI CMO · OPERATOR · BUILDER</div>
      </div>

      <div class="whip-streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="01-on-ai"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c; font-family: "Inter", sans-serif;
      }
      [data-composition-id="01-on-ai"] .stage { position: absolute; inset: 0; }
      [data-composition-id="01-on-ai"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.06) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.06) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="01-on-ai"] .halo {
        position: absolute; top: 50%; left: 50%;
        width: 1800px; height: 700px;
        transform: translate(-50%, -50%);
        background: radial-gradient(ellipse at center, rgba(249,167,44,0.25), transparent 70%);
        opacity: 0; pointer-events: none;
      }
      [data-composition-id="01-on-ai"] .hero {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      [data-composition-id="01-on-ai"] .line {
        font-weight: 800; font-size: 380px;
        letter-spacing: -0.04em; line-height: 0.92;
        color: #f9a72c;
        text-shadow: 0 0 48px rgba(249,167,44,0.85), 0 0 110px rgba(249,167,44,0.40);
        white-space: nowrap;
      }
      [data-composition-id="01-on-ai"] .line .word { display: inline-block; white-space: nowrap; }
      [data-composition-id="01-on-ai"] .line .ch {
        display: inline-block; opacity: 0; transform: translateY(60px);
        will-change: opacity, transform;
      }
      [data-composition-id="01-on-ai"] .underline {
        height: 8px;
        background: linear-gradient(90deg, transparent, #f9a72c 20%, #f9a72c 80%, transparent);
        box-shadow: 0 0 22px rgba(249,167,44,0.55);
        transform: scaleX(0);
        margin: 18px auto 0;
        width: 80%;
      }
      [data-composition-id="01-on-ai"] .sub-line {
        margin-top: 36px;
        font-weight: 700; font-size: 64px;
        letter-spacing: -0.01em;
        color: #fff; opacity: 0;
      }
      [data-composition-id="01-on-ai"] .sub-tag {
        margin-top: 8px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 600; font-size: 22px;
        letter-spacing: 0.32em;
        color: #f9a72c; opacity: 0;
        text-shadow: 0 0 12px rgba(249,167,44,0.40);
      }
      [data-composition-id="01-on-ai"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 95%);
        opacity: 0.65;
      }
      [data-composition-id="01-on-ai"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
        background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 3px 3px;
      }
      [data-composition-id="01-on-ai"] .whip-streak {
        position: absolute; top: 50%; left: 0;
        width: 70%; height: 14px;
        background: linear-gradient(90deg, transparent 0%, rgba(249,167,44,0.95) 50%, transparent 100%);
        filter: blur(10px); transform: translate(-150%, -50%);
        opacity: 0; z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3.5;
        const sel = (q) => `[data-composition-id="01-on-ai"] ${q}`;

        document.querySelectorAll(sel('[data-split]')).forEach((node) => {
          const words = node.textContent.split(' ');
          node.innerHTML = words.map((w) =>
            `<span class="word">${w.split('').map((c) => `<span class="ch">${c}</span>`).join('')}</span>`
          ).join(' ');
        });

        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'), { backgroundPositionY: '-60px', duration: SLOT, ease: 'none' }, 0);

        tl.to(sel('.line .ch'), { y: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.7)', stagger: 0.06 }, 0.05);
        tl.fromTo(sel('.halo'), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.70, ease: 'power3.out' }, 0.30);
        tl.to(sel('.underline'), { scaleX: 1, duration: 0.50, ease: 'power3.out' }, 0.80);
        tl.fromTo(sel('.sub-line'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.50, ease: 'power3.out' }, 1.30);
        tl.fromTo(sel('.sub-tag'), { opacity: 0, y: 8 }, { opacity: 0.92, y: 0, duration: 0.40, ease: 'power3.out' }, 1.80);

        // Subtle halo pulse
        tl.to(sel('.halo'), { scale: 1.04, duration: 0.9, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 1.00);

        tl.set(sel('.whip-streak'), { opacity: 1 }, 3.12);
        tl.fromTo(sel('.whip-streak'),
          { xPercent: -150, scaleX: 0.5 },
          { xPercent: 250, scaleX: 1.5, duration: 0.38, ease: 'power3.in' }, 3.12);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['01-on-ai'] = tl;
      })();
    </script>
  </div>
</template>
