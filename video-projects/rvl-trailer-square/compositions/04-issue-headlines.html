<template id="04-issue-headlines-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="04-issue-headlines" data-start="0" data-duration="6" data-width="1080" data-height="1080">
    <div class="stage">
      <div class="label-top">RECENT ISSUES</div>

      <div class="issue-list">
        <div class="row r1">
          <span class="row-no">W17</span>
          <span class="row-title">Physical AI Becomes Its Own Investment Category</span>
        </div>
        <div class="row r2">
          <span class="row-no">W16</span>
          <span class="row-title">Stablecoin Commerce, Finally</span>
        </div>
        <div class="row r3">
          <span class="row-no">W15</span>
          <span class="row-title">The Unbundling of Venture Capital</span>
        </div>
        <div class="row r4">
          <span class="row-no">W14</span>
          <span class="row-title">AI-Native Brands vs. the DTC Playbook</span>
        </div>
        <div class="row r5">
          <span class="row-no">W13</span>
          <span class="row-title">The New Creator Economy Math</span>
        </div>
      </div>

      <div class="wipe"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="04-issue-headlines"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="04-issue-headlines"] .stage { position: absolute; inset: 0; }
      [data-composition-id="04-issue-headlines"] .label-top {
        position: absolute;
        top: 80px; left: 60px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.32em;
        color: #c3f53b;
        opacity: 0;
      }
      [data-composition-id="04-issue-headlines"] .issue-list {
        position: absolute;
        top: 150px; left: 60px; right: 60px; bottom: 200px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      [data-composition-id="04-issue-headlines"] .row {
        display: flex; align-items: baseline; gap: 28px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(195,245,59,0.22);
        opacity: 0;
        transform: translateX(30px);
      }
      [data-composition-id="04-issue-headlines"] .row:last-child { border-bottom: none; }
      [data-composition-id="04-issue-headlines"] .row-no {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 40px;
        color: #c3f53b;
        letter-spacing: 0.05em;
        text-shadow: 0 0 14px rgba(195,245,59,0.4);
        flex: 0 0 88px;
      }
      [data-composition-id="04-issue-headlines"] .row-title {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 38px;
        color: #ffffff;
        letter-spacing: -0.005em;
        line-height: 1.15;
      }
      [data-composition-id="04-issue-headlines"] .wipe {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #c3f53b;
        z-index: 30;
      }
      [data-composition-id="04-issue-headlines"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 6;
        const sel = (q) => `[data-composition-id="04-issue-headlines"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.label-top'),
          { y: -10, opacity: 0 },
          { y: 0, opacity: 0.9, duration: 0.35, ease: 'power3.out' }, 0.05);

        // All 5 rows fade in stacked with stagger — visible together for ~3.5s
        tl.to(sel('.row'),
          { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out',
            stagger: 0.18 }, 0.30);

        // Highlight each row briefly to draw the eye through the list
        const rows = ['.r1', '.r2', '.r3', '.r4', '.r5'];
        rows.forEach((r, i) => {
          const at = 1.6 + i * 0.55;
          tl.to(sel(`${r} .row-title`),
            { color: '#c3f53b', textShadow: '0 0 18px rgba(195,245,59,0.55)',
              duration: 0.25, ease: 'sine.inOut' }, at);
          tl.to(sel(`${r} .row-title`),
            { color: '#ffffff', textShadow: 'none',
              duration: 0.30, ease: 'sine.inOut' }, at + 0.30);
        });

        // Block-wipe at end
        tl.fromTo(sel('.wipe'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.35, ease: 'power3.in' }, 5.65);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['04-issue-headlines'] = tl;
      })();
    </script>
  </div>
</template>
