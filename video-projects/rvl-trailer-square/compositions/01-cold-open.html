<template id="01-cold-open-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="01-cold-open" data-start="0" data-duration="3" data-width="1080" data-height="1080">
    <div class="stage">
      <div class="stamp-top">R V L &bull; SUNDAY BRIEF</div>
      <div class="hero" data-split>EVERY&nbsp;SUNDAY.</div>
      <div class="underline"></div>
      <div class="wipe"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="01-cold-open"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="01-cold-open"] .stage { position: absolute; inset: 0; }
      [data-composition-id="01-cold-open"] .stamp-top {
        position: absolute;
        top: 80px; left: 50%;
        transform: translateX(-50%);
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.32em;
        color: #c3f53b;
        opacity: 0;
        text-shadow: 0 0 14px rgba(195,245,59,0.4);
      }
      [data-composition-id="01-cold-open"] .hero {
        position: absolute;
        top: 48%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 100px;
        color: #c3f53b;
        letter-spacing: -0.035em;
        line-height: 0.88;
        white-space: nowrap;
        text-shadow: 0 0 36px rgba(195,245,59,0.5);
      }
      [data-composition-id="01-cold-open"] .hero .ch {
        display: inline-block;
        opacity: 0;
        transform: translateY(60px) rotate(10deg);
        will-change: opacity, transform;
      }
      [data-composition-id="01-cold-open"] .underline {
        position: absolute;
        top: 60%; left: 50%;
        transform: translateX(-50%);
        width: 340px; height: 6px;
        background: #c3f53b;
        box-shadow: 0 0 18px rgba(195,245,59,0.7);
        transform-origin: center;
        transform: translateX(-50%) scaleX(0);
      }
      [data-composition-id="01-cold-open"] .wipe {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #c3f53b;
        z-index: 30;
      }
      [data-composition-id="01-cold-open"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3;
        const sel = (q) => `[data-composition-id="01-cold-open"] ${q}`;

        document.querySelectorAll(sel('[data-split]')).forEach((node) => {
          const text = node.textContent;
          node.innerHTML = text.split('').map((c) =>
            (c === ' ' || c === ' ')
              ? '<span class="ch space">&nbsp;</span>'
              : `<span class="ch">${c}</span>`
          ).join('');
        });

        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.stamp-top'),
          { y: -10, opacity: 0 },
          { y: 0, opacity: 0.9, duration: 0.35, ease: 'power3.out' }, 0.10);

        tl.to(sel('.hero .ch'),
          { y: 0, rotate: 0, opacity: 1,
            duration: 0.40, ease: 'back.out(1.9)', stagger: 0.025 }, 0.30);

        tl.to(sel('.underline'),
          { scaleX: 1, duration: 0.55, ease: 'power3.out' }, 0.90);

        // Hold, then block-wipe
        tl.fromTo(sel('.wipe'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.35, ease: 'power3.in' }, 2.65);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['01-cold-open'] = tl;
      })();
    </script>
  </div>
</template>
