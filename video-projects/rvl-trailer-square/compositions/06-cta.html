<template id="06-cta-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="06-cta" data-start="0" data-duration="5" data-width="1080" data-height="1080">
    <div class="stage">
      <div class="rvl-big" data-split>RVL</div>
      <div class="tagline">REVEALING&nbsp;THE&nbsp;FUTURE&nbsp;OF&nbsp;BRANDS,&nbsp;STARTUPS,&nbsp;AND&nbsp;VENTURE&nbsp;CAPITAL.</div>
      <div class="cta-line">
        <span class="cta-main">Sign up free at</span>
        <span class="cta-url">rvl.tech</span>
      </div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="06-cta"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="06-cta"] .stage { position: absolute; inset: 0; }
      [data-composition-id="06-cta"] .rvl-big {
        position: absolute;
        top: 44%; left: 50%;
        transform: translate(-50%, -50%);
        font-weight: 800;
        font-size: 340px;
        color: #c3f53b;
        letter-spacing: -0.03em;
        line-height: 0.85;
        white-space: nowrap;
        text-shadow: 0 0 44px rgba(195,245,59,0.5);
      }
      [data-composition-id="06-cta"] .rvl-big .ch {
        display: inline-block;
        opacity: 0;
        transform: translateY(60px) rotate(10deg);
        will-change: opacity, transform;
      }
      [data-composition-id="06-cta"] .tagline {
        position: absolute;
        top: 72%; left: 50%;
        transform: translateX(-50%);
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.14em;
        color: #ffffff;
        opacity: 0;
        text-align: center;
        max-width: 940px;
      }
      [data-composition-id="06-cta"] .cta-line {
        position: absolute;
        top: 80%; left: 50%;
        transform: translateX(-50%);
        display: flex; align-items: baseline; gap: 12px;
        opacity: 0;
        white-space: nowrap;
      }
      [data-composition-id="06-cta"] .cta-main {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.02em;
        color: #ffffff;
      }
      [data-composition-id="06-cta"] .cta-url {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.04em;
        color: #c3f53b;
        text-shadow: 0 0 20px rgba(195,245,59,0.6);
      }
      [data-composition-id="06-cta"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 5;
        const sel = (q) => `[data-composition-id="06-cta"] ${q}`;

        document.querySelectorAll(sel('[data-split]')).forEach((node) => {
          const text = node.textContent;
          node.innerHTML = text.split('').map((c) =>
            c === ' ' ? '<span class="ch space">&nbsp;</span>' : `<span class="ch">${c}</span>`
          ).join('');
        });

        const tl = gsap.timeline({ paused: true });

        // RVL per-char burst
        tl.to(sel('.rvl-big .ch'),
          { y: 0, rotate: 0, opacity: 1,
            duration: 0.45, ease: 'back.out(1.8)', stagger: 0.12 }, 0.10);

        tl.fromTo(sel('.tagline'),
          { y: 24, opacity: 0 },
          { y: 0, opacity: 0.92, duration: 0.50, ease: 'power3.out' }, 0.95);

        tl.fromTo(sel('.cta-line'),
          { y: 16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.50, ease: 'power3.out' }, 1.40);

        // Pulse glow on URL near end
        tl.to(sel('.cta-url'),
          { textShadow: '0 0 36px rgba(195,245,59,0.95)', duration: 0.55,
            yoyo: true, repeat: 1, ease: 'sine.inOut' }, 3.40);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['06-cta'] = tl;
      })();
    </script>
  </div>
</template>
