<template id="01-hook-template">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet" />

  <div
    data-composition-id="01-hook"
    data-start="0"
    data-duration="3.5"
    data-width="1920"
    data-height="1080"
  >
    <div class="stage">
      <div class="grid-floor"></div>
      <div class="crosshair" style="top: 22%; left: 22%;">+</div>
      <div class="crosshair" style="top: 22%; left: 78%;">+</div>
      <div class="crosshair" style="top: 78%; left: 22%;">+</div>
      <div class="crosshair" style="top: 78%; left: 78%;">+</div>

      <div class="type-stage">
        <div class="line line-1">
          <span class="word w1">Your</span>
          <span class="word w2">growth</span>
          <span class="word w3">engine</span>
        </div>
        <div class="line line-2">
          <span class="word w4">wasn't</span>
          <span class="word w5">built</span>
          <span class="word w6">for the</span>
        </div>
        <div class="line line-hero">
          <span class="hero h1">AI</span>
          <span class="hero h2">ERA</span>
        </div>
      </div>

      <div class="whip-streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="01-hook"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="01-hook"] .stage { position: absolute; inset: 0; }
      [data-composition-id="01-hook"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        transform-origin: 50% 50%;
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.06) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.06) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="01-hook"] .crosshair {
        position: absolute; transform: translate(-50%, -50%);
        font: 400 28px/1 monospace; color: rgba(249,167,44,0.30);
        pointer-events: none;
      }
      [data-composition-id="01-hook"] .type-stage {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center; width: 100%;
      }
      [data-composition-id="01-hook"] .line {
        display: flex; justify-content: center; align-items: baseline;
        gap: 24px; white-space: nowrap;
      }
      [data-composition-id="01-hook"] .line-1 { margin-bottom: 12px; }
      [data-composition-id="01-hook"] .line-2 { margin-bottom: 32px; }
      [data-composition-id="01-hook"] .line-hero { gap: 32px; }
      [data-composition-id="01-hook"] .word {
        display: inline-block;
        font-weight: 600;
        font-size: 96px;
        letter-spacing: -0.02em;
        background: linear-gradient(180deg, #ffffff 0%, #f7d99a 70%, #f9a72c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 32px rgba(249,167,44,0.22);
        opacity: 0;
      }
      [data-composition-id="01-hook"] .hero {
        display: inline-block;
        font-weight: 800;
        font-size: 240px;
        letter-spacing: -0.04em;
        color: #f9a72c;
        text-shadow:
          0 0 30px rgba(249,167,44,0.85),
          0 0 80px rgba(249,167,44,0.35);
        opacity: 0;
      }
      [data-composition-id="01-hook"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 95%);
        opacity: 0.7;
      }
      [data-composition-id="01-hook"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.08;
        background-image:
          radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 2px 1px;
      }
      [data-composition-id="01-hook"] .whip-streak {
        position: absolute; top: 50%; left: 0;
        width: 70%; height: 14px;
        background: linear-gradient(90deg, transparent 0%, rgba(249,167,44,0.95) 50%, transparent 100%);
        filter: blur(10px);
        transform: translate(-150%, -50%);
        opacity: 0;
        z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3.5;
        const sel = (q) => `[data-composition-id="01-hook"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'),
          { backgroundPositionY: '-120px', duration: SLOT, ease: 'none' }, 0);

        tl.to(sel('.vignette'),
          { opacity: 0.9, duration: 2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0);

        // Line 1 words
        tl.fromTo(sel('.w1'), { x: 180, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.30, ease: 'expo.out' }, 0.10);
        tl.fromTo(sel('.w2'), { x: 80, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.28, ease: 'expo.out' }, 0.35);
        tl.fromTo(sel('.w3'), { x: 40, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.26, ease: 'expo.out' }, 0.55);

        // Line 2 words
        tl.fromTo(sel('.w4'), { x: 60, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.26, ease: 'expo.out' }, 0.80);
        tl.fromTo(sel('.w5'), { x: 30, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.24, ease: 'expo.out' }, 1.00);
        tl.fromTo(sel('.w6'), { x: 20, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.24, ease: 'expo.out' }, 1.18);

        // Hero punch
        tl.fromTo(sel('.h1'),
          { scale: 0.82, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.40, ease: 'back.out(1.4)' }, 1.55);
        tl.fromTo(sel('.h2'),
          { scale: 0.82, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.40, ease: 'back.out(1.4)' }, 1.72);

        // Scale-through exit on hero
        tl.to(sel('.line-hero'),
          { scale: 5.5, opacity: 0, duration: 1.0, ease: 'power2.in' }, 2.35);

        // Chrome lines fade as hero blows through
        tl.to([sel('.line-1'), sel('.line-2')],
          { opacity: 0, duration: 0.45, ease: 'power2.in' }, 2.4);

        // Grid tilt for continuity
        tl.to(sel('.grid-floor'), { rotate: 4, duration: 0.9, ease: 'power2.in' }, 2.5);

        // Whip streak fires at exit
        tl.set(sel('.whip-streak'), { opacity: 1 }, 3.15);
        tl.fromTo(sel('.whip-streak'),
          { xPercent: -150, scaleX: 0.5 },
          { xPercent: 250, scaleX: 1.5, duration: 0.35, ease: 'power3.in' }, 3.15);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['01-hook'] = tl;
      })();
    </script>
  </div>
</template>
