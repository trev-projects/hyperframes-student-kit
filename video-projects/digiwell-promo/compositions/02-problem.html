<template id="02-problem-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet" />

  <div
    data-composition-id="02-problem"
    data-start="0"
    data-duration="4"
    data-width="1920"
    data-height="1080"
  >
    <div class="stage">
      <div class="grid-floor"></div>
      <div class="crosshair" style="top: 22%; left: 22%;">+</div>
      <div class="crosshair" style="top: 22%; left: 78%;">+</div>
      <div class="crosshair" style="top: 78%; left: 22%;">+</div>
      <div class="crosshair" style="top: 78%; left: 78%;">+</div>

      <div class="cards">
        <div class="card card-a">
          <div class="icon-wrap">
            <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#ff8a2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="16" width="48" height="32" rx="3" />
              <path d="M8 20 L32 38 L56 20" />
              <line x1="12" y1="52" x2="52" y2="12" stroke="#ff8a2a" stroke-width="2" opacity="0.6"/>
            </svg>
          </div>
          <div class="label">COLD LEADS</div>
          <div class="stat"><span class="strike">0.2%</span> conversion</div>
        </div>

        <div class="card card-b">
          <div class="icon-wrap">
            <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#ff8a2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 22 L14 50 Q14 54 18 54 L46 54 Q50 54 50 50 L50 22" />
              <path d="M10 22 L54 22" />
              <path d="M26 14 L38 14 L38 22 L26 22 Z" />
              <line x1="24" y1="30" x2="24" y2="46" />
              <line x1="32" y1="30" x2="32" y2="46" />
              <line x1="40" y1="30" x2="40" y2="46" />
            </svg>
          </div>
          <div class="label">DEAD LISTS</div>
          <div class="stat">-43% engagement</div>
        </div>

        <div class="card card-c">
          <div class="icon-wrap">
            <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#ff8a2a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20 L32 44 L52 20" />
              <path d="M32 44 L32 18" />
            </svg>
          </div>
          <div class="label">NEVER CONVERT</div>
          <div class="stat"><span class="strike">$0</span> ROI</div>
        </div>
      </div>

      <div class="whip-streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="02-problem"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="02-problem"] .stage { position: absolute; inset: 0; }
      [data-composition-id="02-problem"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.06) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.06) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="02-problem"] .crosshair {
        position: absolute; transform: translate(-50%, -50%);
        font: 400 28px/1 monospace; color: rgba(249,167,44,0.30);
      }
      [data-composition-id="02-problem"] .cards {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex; gap: 64px;
      }
      [data-composition-id="02-problem"] .card {
        width: 460px; height: 340px;
        background: linear-gradient(135deg,
          rgba(255,255,255,0.06) 0%,
          rgba(255,255,255,0.02) 40%,
          rgba(255,255,255,0.01) 70%,
          rgba(255,255,255,0.045) 100%);
        backdrop-filter: blur(14px) saturate(1.12);
        border-radius: 20px;
        border: 1px solid rgba(255,138,42,0.30);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.18),
          0 0 60px rgba(255,138,42,0.18);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 24px;
        opacity: 0;
        transform: translateY(80px);
      }
      [data-composition-id="02-problem"] .icon-wrap {
        width: 80px; height: 80px;
        display: flex; align-items: center; justify-content: center;
      }
      [data-composition-id="02-problem"] .label {
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.06em;
        color: #ff8a2a;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(255,138,42,0.45);
      }
      [data-composition-id="02-problem"] .stat {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 28px;
        color: #d9d9de;
        opacity: 0.8;
      }
      [data-composition-id="02-problem"] .strike {
        text-decoration: line-through;
        text-decoration-color: #ff8a2a;
        text-decoration-thickness: 2px;
      }
      [data-composition-id="02-problem"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.95) 95%);
        opacity: 0.75;
      }
      [data-composition-id="02-problem"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.08;
        background-image:
          radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px, 7px 7px;
        background-position: 0 0, 1px 2px, 2px 1px;
      }
      [data-composition-id="02-problem"] .whip-streak {
        position: absolute; top: 50%; left: 0;
        width: 70%; height: 14px;
        background: linear-gradient(90deg, transparent 0%, rgba(249,167,44,0.95) 50%, transparent 100%);
        filter: blur(10px);
        transform: translate(-150%, -50%);
        opacity: 0; z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 4;
        const sel = (q) => `[data-composition-id="02-problem"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'),
          { backgroundPositionY: '-80px', duration: SLOT, ease: 'none' }, 0);

        // Cascade cards
        tl.fromTo(sel('.card-a'),
          { y: 80, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.10);
        tl.fromTo(sel('.card-b'),
          { y: 80, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 1.05);
        tl.fromTo(sel('.card-c'),
          { y: 80, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 2.05);

        // Subtle jitter on held cards
        tl.to([sel('.card-a'), sel('.card-b'), sel('.card-c')],
          { y: -6, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: 0.12 }, 2.6);

        // Dim all together for exit
        tl.to(sel('.cards'),
          { opacity: 0.2, scale: 0.95, duration: 0.4, ease: 'power2.in' }, 3.45);

        // Whip streak
        tl.set(sel('.whip-streak'), { opacity: 1 }, 3.65);
        tl.fromTo(sel('.whip-streak'),
          { xPercent: -150, scaleX: 0.5 },
          { xPercent: 250, scaleX: 1.5, duration: 0.35, ease: 'power3.in' }, 3.65);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['02-problem'] = tl;
      })();
    </script>
  </div>
</template>
