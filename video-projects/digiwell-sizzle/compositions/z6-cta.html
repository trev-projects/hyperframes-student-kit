<template id="z6-cta-template">
  <script src="assets/gsap.min.js"></script>
  <script src="assets/sz.js"></script>

  <div data-composition-id="z6-cta" data-start="0" data-duration="5.6" data-width="1920" data-height="1080">
    <div class="sz-stage sz-paper panel">
      <div class="wrap">
        <div class="mark"><div class="word">Digiwell<span class="dot">.</span></div><div class="sub sz-mono">MARKETING</div></div>
        <div class="sz-h head"><span class="ha" data-words>Let&rsquo;s talk about</span> <span class="sz-hl"><span class="sz-hl-bar"></span><span class="sz-hl-text">your email.</span></span></div>
        <div class="sz-lede lede">We&rsquo;ll see where things stand and whether there&rsquo;s a useful first project.</div>
        <div class="pill">digiwellmarketing.com</div>
      </div>
      <div class="sz-vignette"></div>
      <div class="sz-grain"></div>
    </div>
    <div class="sz-edge edge"></div>

    <style>
      /* Self-hosted faces (also in assets/sz.css); declared here so each scene lints standalone. */
      @font-face { font-family: "Sora"; src: url("assets/fonts/Sora.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      [data-composition-id="z6-cta"] { position: absolute; inset: 0; overflow: hidden; }
      [data-composition-id="z6-cta"] .panel { clip-path: inset(0% 0% 0% 100%); }
      [data-composition-id="z6-cta"] .edge { top: 0; bottom: 0; left: 0; width: 14px; background: var(--dw-terra); transform: translateX(2200px); }
      [data-composition-id="z6-cta"] .wrap { width: 100%; height: 100%; padding: 0 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      [data-composition-id="z6-cta"] .word { font-weight: 800; font-size: 60px; letter-spacing: -2px; line-height: 1; }
      [data-composition-id="z6-cta"] .dot { color: var(--dw-terra); }
      [data-composition-id="z6-cta"] .sub { margin-top: 8px; font-size: 18px; letter-spacing: 8px; color: var(--dw-muted); }
      [data-composition-id="z6-cta"] .head { margin-top: 60px; font-size: 136px; max-width: 1500px; }
      [data-composition-id="z6-cta"] .lede { margin-top: 36px; max-width: 1100px; }
      [data-composition-id="z6-cta"] .pill { margin-top: 56px; background: var(--dw-terra); color: var(--dw-on-terra); border-radius: 999px; padding: 26px 56px; font-family: "Manrope", sans-serif; font-weight: 700; font-size: 38px; }

      [data-composition-id="z6-cta"].v .wrap { padding: 0 70px; }
      [data-composition-id="z6-cta"].v .head { font-size: 124px; }
    </style>

    <script>
      (function () {
        var SLOT = 5.6;
        var root = document.querySelector('[data-composition-id="z6-cta"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        SZ.fmt(root);
        SZ.words(root);
        var tl = gsap.timeline({ paused: true });

        tl.fromTo(q('.panel'), { clipPath: 'inset(0% 0% 0% 100%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.5, ease: 'power3.inOut' }, 0);
        tl.fromTo(q('.edge'), { x: +root.getAttribute('data-width') }, { x: -14, duration: 0.5, ease: 'power3.inOut' }, 0);

        tl.from(q('.mark'), { y: -30, opacity: 0, duration: 0.4, ease: 'power3.out' }, 0.45);
        tl.from(qa('.ha .sz-w'), { y: 90, opacity: 0, duration: 0.5, ease: 'expo.out', stagger: 0.06 }, 0.55);
        tl.from(q('.sz-hl-text'), { y: 90, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.80);
        tl.fromTo(q('.sz-hl-bar'), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power3.out' }, 1.15);
        tl.from(q('.lede'), { y: 24, opacity: 0, duration: 0.45, ease: 'power2.out' }, 1.20);
        tl.from(q('.pill'), { scale: 0.6, opacity: 0, duration: 0.45, ease: 'back.out(2.2)' }, 1.50);
        tl.to(q('.pill'), { scale: 1.04, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 2.40);

        SZ.hold(tl, SLOT);
        window.__timelines = window.__timelines || {};
        window.__timelines["z6-cta"] = tl;
      })();
    </script>
  </div>
</template>
