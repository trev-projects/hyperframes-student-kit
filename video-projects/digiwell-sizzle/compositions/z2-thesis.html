<template id="z2-thesis-template">
  <script src="assets/gsap.min.js"></script>
  <script src="assets/sz.js"></script>

  <div data-composition-id="z2-thesis" data-start="0" data-duration="4.2" data-width="1920" data-height="1080">
    <!-- Iris opens from centre over the hook. -->
    <div class="sz-stage sz-terra iris">
      <div class="wrap">
        <div class="sz-h ln ln1"><span class="sz-w">It&rsquo;s</span> <span class="sz-w">not</span> <span class="sz-w">a</span> <span class="strike sz-w"><span>traffic</span><span class="bar"></span></span> <span class="sz-w">problem.</span></div>
        <div class="sz-h ln ln2"><span class="sz-w">It&rsquo;s</span> <span class="sz-w">an</span> <span class="mark sz-w"><span class="mk-bg"></span><span class="mk-t">email</span></span> <span class="sz-w">problem.</span></div>
      </div>
      <div class="sz-vignette"></div>
      <div class="sz-grain"></div>
    </div>

    <style>
      /* Self-hosted faces (also in assets/sz.css); declared here so each scene lints standalone. */
      @font-face { font-family: "Sora"; src: url("assets/fonts/Sora.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      [data-composition-id="z2-thesis"] { position: absolute; inset: 0; overflow: hidden; }
      [data-composition-id="z2-thesis"] .iris { clip-path: circle(0px at 50% 50%); }
      [data-composition-id="z2-thesis"] .wrap { width: 100%; height: 100%; padding: 0 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; text-align: center; }
      [data-composition-id="z2-thesis"] .ln { font-size: 104px; color: var(--dw-on-terra); }
      [data-composition-id="z2-thesis"] .strike { position: relative; }
      [data-composition-id="z2-thesis"] .bar { position: absolute; left: -0.05em; right: -0.05em; top: 54%; height: 0.11em; background: var(--dw-sand); border-radius: 0.05em; transform: scaleX(0); transform-origin: left center; }
      [data-composition-id="z2-thesis"] .mark { position: relative; padding: 0 0.14em; }
      [data-composition-id="z2-thesis"] .mk-bg { position: absolute; inset: 0.06em 0 -0.02em 0; background: var(--dw-on-terra); border-radius: 0.08em; transform: scaleX(0); transform-origin: left center; }
      [data-composition-id="z2-thesis"] .mk-t { position: relative; z-index: 1; }

      [data-composition-id="z2-thesis"].v .wrap { padding: 0 70px; gap: 70px; }
      [data-composition-id="z2-thesis"].v .ln { font-size: 108px; }
    </style>

    <script>
      (function () {
        var SLOT = 4.2;
        var root = document.querySelector('[data-composition-id="z2-thesis"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        SZ.fmt(root);
        var tl = gsap.timeline({ paused: true });

        // ENTRY: iris from centre, over the outgoing hook.
        tl.fromTo(q('.iris'), { clipPath: 'circle(0px at 50% 50%)' },
          { clipPath: 'circle(1400px at 50% 50%)', duration: 0.55, ease: 'expo.inOut' }, 0);

        tl.from(qa('.ln1 > .sz-w'), { y: 80, opacity: 0, duration: 0.45, ease: 'expo.out', stagger: 0.06 }, 0.45);
        tl.to(q('.bar'), { scaleX: 1, duration: 0.32, ease: 'power3.out' }, 1.15);
        tl.to(q('.ln1'), { opacity: 0.55, duration: 0.4, ease: 'power2.out' }, 1.45);

        tl.from(qa('.ln2 > .sz-w'), { y: 80, opacity: 0, duration: 0.45, ease: 'expo.out', stagger: 0.07 }, 1.60);
        tl.to(q('.mk-bg'), { scaleX: 1, duration: 0.4, ease: 'power3.out' }, 2.10);
        tl.to(q('.mk-t'), { color: '#B5532E', duration: 0.2, ease: 'none' }, 2.22);
        tl.fromTo(q('.mark'), { scale: 1 }, { scale: 1.06, duration: 0.18, ease: 'power2.out', yoyo: true, repeat: 1 }, 2.20);

        SZ.hold(tl, SLOT);
        window.__timelines = window.__timelines || {};
        window.__timelines["z2-thesis"] = tl;
      })();
    </script>
  </div>
</template>
