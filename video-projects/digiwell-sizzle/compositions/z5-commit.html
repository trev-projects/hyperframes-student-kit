<template id="z5-commit-template">
  <script src="assets/gsap.min.js"></script>
  <script src="assets/sz.js"></script>

  <div data-composition-id="z5-commit" data-start="0" data-duration="3.6" data-width="1920" data-height="1080">
    <!-- Diagonal wipe in ink, led by a skewed terracotta slab. -->
    <div class="sz-stage sz-ink diag">
      <div class="wrap">
        <div class="sz-eyebrow eye">What you can count on</div>
        <div class="sz-h ln a">One owner.</div>
        <div class="sz-h ln b">Your tools.</div>
        <div class="sz-h ln c">Your data.</div>
        <div class="sz-h ln d">Tested before it goes live.</div>
      </div>
      <div class="sz-grain"></div>
    </div>
    <div class="slab"></div>

    <style>
      /* Self-hosted faces (also in assets/sz.css); declared here so each scene lints standalone. */
      @font-face { font-family: "Sora"; src: url("assets/fonts/Sora.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      [data-composition-id="z5-commit"] { position: absolute; inset: 0; overflow: hidden; }
      [data-composition-id="z5-commit"] .diag { clip-path: polygon(0% 0%, 0% 0%, -30% 100%, -30% 100%); }
      [data-composition-id="z5-commit"] .slab { position: absolute; top: -20%; left: 0; width: 90px; height: 140%; background: var(--dw-terra); transform: translateX(-300px) skewX(-16deg); }
      [data-composition-id="z5-commit"] .wrap { width: 100%; height: 100%; padding: 0 120px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
      [data-composition-id="z5-commit"] .eye { color: var(--dw-sand); margin-bottom: 26px; }
      [data-composition-id="z5-commit"] .ln { font-size: 112px; color: var(--dw-paper); transform-origin: left center; }
      [data-composition-id="z5-commit"] .d { color: var(--dw-sand); }

      [data-composition-id="z5-commit"].v .wrap { padding: 0 80px; gap: 14px; }
      [data-composition-id="z5-commit"].v .ln { font-size: 104px; }
    </style>

    <script>
      (function () {
        var SLOT = 3.6;
        var root = document.querySelector('[data-composition-id="z5-commit"]');
        var q = function (s) { return root.querySelector(s); };
        SZ.fmt(root);
        var tl = gsap.timeline({ paused: true });

        tl.fromTo(q('.diag'), { clipPath: 'polygon(0% 0%, 0% 0%, -30% 100%, -30% 100%)' },
          { clipPath: 'polygon(0% 0%, 130% 0%, 100% 100%, -30% 100%)', duration: 0.48, ease: 'power3.inOut' }, 0);
        tl.fromTo(q('.slab'), { x: -300 }, { x: 2600, duration: 0.48, ease: 'power3.inOut' }, 0);

        tl.from(q('.eye'), { x: -30, opacity: 0, duration: 0.3, ease: 'power3.out' }, 0.30);
        // Four slams, 0.5s apart.
        [['.a', 0.45], ['.b', 0.95], ['.c', 1.45], ['.d', 1.95]].forEach(function (k) {
          tl.from(q(k[0]), { scale: 1.35, opacity: 0, filter: 'blur(14px)', duration: 0.3, ease: 'expo.out' }, k[1]);
        });

        SZ.hold(tl, SLOT);
        window.__timelines = window.__timelines || {};
        window.__timelines["z5-commit"] = tl;
      })();
    </script>
  </div>
</template>
