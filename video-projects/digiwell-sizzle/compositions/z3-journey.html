<template id="z3-journey-template">
  <script src="assets/gsap.min.js"></script>
  <script src="assets/sz.js"></script>

  <div data-composition-id="z3-journey" data-start="0" data-duration="6.4" data-width="1920" data-height="1080">
    <!-- Paper panel wipes in from the right with a terracotta leading edge. -->
    <div class="sz-stage sz-paper panel">
      <div class="wrap">
        <div class="sz-eyebrow eye">Where we start</div>
        <div class="sz-h head" data-words>Start with one journey.</div>
        <div class="chips">
          <div class="chip ch1">Welcome and nurture</div>
          <div class="chip ch2">Enquiry follow&#8209;up</div>
          <div class="chip ch3">Newsletter loop</div>
        </div>
        <div class="sz-lede cap">Pick the one that matters most.</div>
        <div class="path">
          <div class="p-ends sz-mono"><span class="e1">INTEREST</span><span class="e2">A REAL CONVERSATION</span></div>
          <div class="p-line"><div class="p-fill"></div>
            <div class="env m1">&#9993;</div><div class="env m2">&#9993;</div><div class="env m3">&#9993;</div><div class="env m4">&#9993;</div>
          </div>
        </div>
      </div>
      <div class="sz-vignette"></div>
      <div class="sz-grain"></div>
    </div>
    <div class="sz-edge edge"></div>

    <style>
      /* Self-hosted faces (also in assets/sz.css); declared here so each scene lints standalone. */
      @font-face { font-family: "Sora"; src: url("assets/fonts/Sora.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      [data-composition-id="z3-journey"] { position: absolute; inset: 0; overflow: hidden; }
      [data-composition-id="z3-journey"] .panel { clip-path: inset(0% 0% 0% 100%); }
      [data-composition-id="z3-journey"] .edge { top: 0; bottom: 0; left: 0; width: 14px; background: var(--dw-terra); transform: translateX(2200px); }
      [data-composition-id="z3-journey"] .wrap { width: 100%; height: 100%; padding: 0 120px; display: flex; flex-direction: column; justify-content: center; }
      [data-composition-id="z3-journey"] .head { margin-top: 18px; font-size: 112px; }
      [data-composition-id="z3-journey"] .chips { margin-top: 56px; display: flex; gap: 24px; flex-wrap: wrap; }
      [data-composition-id="z3-journey"] .chip { font-weight: 700; font-size: 36px; padding: 22px 36px; border-radius: 999px; background: var(--dw-card); border: 2px solid var(--dw-card-border); color: var(--dw-ink); }
      [data-composition-id="z3-journey"] .cap { margin-top: 30px; color: var(--dw-muted); }
      [data-composition-id="z3-journey"] .path { margin-top: 70px; }
      [data-composition-id="z3-journey"] .p-ends { display: flex; justify-content: space-between; font-size: 22px; letter-spacing: 3px; color: var(--dw-muted); margin-bottom: 26px; }
      [data-composition-id="z3-journey"] .p-ends .e2 { color: var(--dw-terra); }
      [data-composition-id="z3-journey"] .p-line { position: relative; height: 6px; border-radius: 3px; background: var(--dw-rule); }
      [data-composition-id="z3-journey"] .p-fill { position: absolute; inset: 0; border-radius: 3px; background: var(--dw-terra); transform: scaleX(0); transform-origin: left center; }
      [data-composition-id="z3-journey"] .env { position: absolute; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: var(--dw-card); border: 3px solid var(--dw-terra); color: var(--dw-terra); display: flex; align-items: center; justify-content: center; font-size: 32px; }
      [data-composition-id="z3-journey"] .m1 { left: 20%; } [data-composition-id="z3-journey"] .m2 { left: 40%; }
      [data-composition-id="z3-journey"] .m3 { left: 60%; } [data-composition-id="z3-journey"] .m4 { left: 80%; }

      [data-composition-id="z3-journey"].v .wrap { padding: 0 80px; }
      [data-composition-id="z3-journey"].v .head { font-size: 112px; }
      [data-composition-id="z3-journey"].v .chips { flex-direction: column; align-items: flex-start; }
      [data-composition-id="z3-journey"].v .path { margin-top: 90px; }
    </style>

    <script>
      (function () {
        var SLOT = 6.4;
        var root = document.querySelector('[data-composition-id="z3-journey"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        SZ.fmt(root);
        SZ.words(root);
        var tl = gsap.timeline({ paused: true });

        // ENTRY: panel wipe right-to-left; the edge rides the seam.
        tl.fromTo(q('.panel'), { clipPath: 'inset(0% 0% 0% 100%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.5, ease: 'power3.inOut' }, 0);
        tl.fromTo(q('.edge'), { x: +root.getAttribute('data-width') }, { x: -14, duration: 0.5, ease: 'power3.inOut' }, 0);

        tl.from(q('.eye'), { x: -30, opacity: 0, duration: 0.4, ease: 'power3.out' }, 0.40);
        tl.from(qa('.head .sz-w'), { y: 80, opacity: 0, duration: 0.5, ease: 'expo.out', stagger: 0.06 }, 0.50);
        tl.from(qa('.chip'), { y: 40, opacity: 0, duration: 0.42, ease: 'back.out(1.7)', stagger: 0.12 }, 1.05);

        // A selector browses the three journeys; none is "the" answer.
        [['.ch1', 1.60], ['.ch2', 2.00], ['.ch3', 2.40]].forEach(function (k) {
          tl.to(q(k[0]), { backgroundColor: '#B5532E', borderColor: '#B5532E', color: '#F1ECE3', scale: 1.05, duration: 0.14, ease: 'power2.out' }, k[1]);
          tl.to(q(k[0]), { backgroundColor: '#FFFFFF', borderColor: '#C49A70', color: '#1F1B17', scale: 1, duration: 0.18, ease: 'power2.in' }, k[1] + 0.26);
        });
        tl.from(q('.cap'), { y: 20, opacity: 0, duration: 0.4, ease: 'power2.out' }, 2.75);

        // One journey: follow-up travels from interest to a real conversation.
        tl.from(q('.path'), { opacity: 0, duration: 0.3, ease: 'power2.out' }, 3.15);
        tl.to(q('.p-fill'), { scaleX: 1, duration: 1.5, ease: 'power1.inOut' }, 3.30);
        [0.2, 0.4, 0.6, 0.8].forEach(function (p, i) {
          tl.from(q('.m' + (i + 1)), { scale: 0, duration: 0.35, ease: 'back.out(2.4)' }, 3.30 + p * 1.5);
        });
        tl.to(q('.e2'), { scale: 1.08, transformOrigin: 'right center', duration: 0.2, ease: 'power2.out', yoyo: true, repeat: 1 }, 4.75);

        SZ.hold(tl, SLOT);
        window.__timelines = window.__timelines || {};
        window.__timelines["z3-journey"] = tl;
      })();
    </script>
  </div>
</template>
