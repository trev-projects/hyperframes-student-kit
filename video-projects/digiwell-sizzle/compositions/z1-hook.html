<template id="z1-hook-template">
  <script src="assets/gsap.min.js"></script>
  <script src="assets/sz.js"></script>

  <div data-composition-id="z1-hook" data-start="0" data-duration="5.8" data-width="1920" data-height="1080">
    <div class="cn-stage  st">
      <div class="cn-mark cn-corner"></div>
      <div class="wrap">
        <div class="txt">
          <div class="cn-kick eye">For coaches, consultants, authors and course creators</div>
          <div class="cn-h l1" data-words>You&rsquo;ve already earned <span class="acc">the audience.</span></div>
          <div class="cn-h l2" data-words>Then the list <span class="acc">goes quiet.</span></div>
        </div>
        <div class="ui">
          <div class="cn-card card c1"><div class="ico">&#9993;</div><div class="meta"><div class="t">New subscriber</div><div class="s">Joined your list</div></div><div class="chip">Just now</div></div>
          <div class="cn-card card c2"><div class="ico">&#9636;</div><div class="meta"><div class="t">Newsletter</div><div class="s">Still in drafts</div></div><div class="chip">Draft</div></div>
          <div class="cn-card card c3"><div class="ico">&#8635;</div><div class="meta"><div class="t">Welcome sequence</div><div class="s">Not set up yet</div></div><div class="chip">Off</div></div>
          <div class="days"><span class="d-lab">Day</span><span class="d-num">1</span><span class="d-state">Nothing sent</span></div>
        </div>
      </div>
      <div class="cn-grain"></div>
    </div>

    <style>
      /* Self-hosted faces (also in assets/sz.css); declared here so each scene lints standalone. */
      @font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: block; }
      @font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader-Italic.woff2") format("woff2"); font-weight: 200 800; font-style: italic; font-display: block; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      [data-composition-id="z1-hook"] { position: absolute; inset: 0; overflow: hidden; }
      [data-composition-id="z1-hook"].v .cn-corner { top: 120px; left: 80px; }
      [data-composition-id="z1-hook"] .wrap { width: 100%; height: 100%; padding: 60px 110px 0; display: flex; align-items: center; gap: 90px; }
      [data-composition-id="z1-hook"] .txt { flex: 1 1 0; }
      [data-composition-id="z1-hook"] .eye { margin-bottom: 30px; max-width: 760px; line-height: 1.5; }
      [data-composition-id="z1-hook"] .cn-h { font-size: 96px; }
      [data-composition-id="z1-hook"] .l2 { margin-top: 44px; }
      [data-composition-id="z1-hook"] .ui { flex: 0 0 700px; display: flex; flex-direction: column; gap: 20px; }
      [data-composition-id="z1-hook"] .card { display: flex; align-items: center; gap: 24px; padding: 26px 28px; }
      [data-composition-id="z1-hook"] .ico { flex: 0 0 64px; height: 64px; border-radius: 50%; background: var(--cn-cedar); color: var(--cn-mint-3); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; }
      [data-composition-id="z1-hook"] .meta { flex: 1 1 auto; }
      [data-composition-id="z1-hook"] .t { font-weight: 700; font-size: 32px; color: var(--cn-text); }
      [data-composition-id="z1-hook"] .s { margin-top: 4px; font-weight: 500; font-size: 25px; color: var(--cn-text-3); }
      [data-composition-id="z1-hook"] .chip { font-family: "Inter", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cn-mint-2); background: rgba(127,182,158,0.14); border-radius: 999px; padding: 10px 16px; }
      [data-composition-id="z1-hook"] .days { align-self: flex-start; display: flex; align-items: baseline; gap: 16px; border: 2px dashed var(--cn-line-2); border-radius: 999px; padding: 16px 28px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; }
      [data-composition-id="z1-hook"] .d-lab { color: var(--cn-mint-2); }
      [data-composition-id="z1-hook"] .d-num { color: var(--cn-mint-3); font-size: 38px; min-width: 2ch; font-variant-numeric: tabular-nums; }
      [data-composition-id="z1-hook"] .d-state { color: var(--cn-text-3); }
      [data-composition-id="z1-hook"].v .wrap { flex-direction: column; justify-content: center; align-items: stretch; padding: 0 80px; gap: 80px; }
      [data-composition-id="z1-hook"].v .txt { flex: 0 0 auto; }
      [data-composition-id="z1-hook"].v .ui { flex: 0 0 auto; }
    </style>

    <script>
      (function () {
        var SLOT = 5.8;
        var root = document.querySelector('[data-composition-id="z1-hook"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return root.querySelectorAll(s); };
        var V = SZ.fmt(root);
        var W = +root.getAttribute('data-width'), H = +root.getAttribute('data-height');
        SZ.marks(root);
        SZ.words(root);
        var tl = gsap.timeline({ paused: true });
        tl.from(q('.eye'), { y: 16, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.15);
        tl.from(qa('.l1 .cn-w'), { y: 50, opacity: 0, duration: 0.6, ease: 'power3.out', stagger: 0.06 }, 0.30);
        // The audience arrives, but nothing around it is running.
        ['.c1', '.c2', '.c3'].forEach(function (c, i) {
          tl.from(q(c), { x: 70, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.90 + i * 0.30);
        });
        tl.from(q('.days'), { y: 20, opacity: 0, duration: 0.45, ease: 'power3.out' }, 2.05);
        var num = q('.d-num'), d = { v: 1 };
        tl.to(d, { v: 23, duration: 1.3, ease: 'power1.in', onUpdate: function () { num.textContent = Math.round(d.v); } }, 2.15);
        tl.to(qa('.card'), { opacity: 0.45, filter: 'saturate(0)', duration: 0.7, ease: 'power2.out' }, 2.30);
        tl.from(qa('.l2 .cn-w'), { y: 50, opacity: 0, duration: 0.6, ease: 'power3.out', stagger: 0.07 }, 3.20);
        SZ.hold(tl, SLOT);
        window.__timelines = window.__timelines || {};
        window.__timelines["z1-hook"] = tl;
      })();
    </script>
  </div>
</template>
