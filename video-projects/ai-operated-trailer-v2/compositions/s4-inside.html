<template id="s4-inside-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="s4-inside" data-start="0" data-duration="3.6" data-width="1920" data-height="1080">
    <!-- Cover wipe: paper rises from the bottom with a terracotta leading edge. -->
    <div class="stage">
      <div class="content">
        <div class="eyebrow">EVERY&nbsp;THURSDAY&nbsp;&middot;&nbsp;THREE&nbsp;THINGS</div>

        <div class="deck-wrap">
          <div class="deck">
            <div class="card c1">
              <div class="num">01 / NEWS</div>
              <div class="title">What actually moved.</div>
              <div class="body">Three stories, and what they mean for your business.</div>
            </div>
            <div class="card c2 feature">
              <div class="num">02 / THE DROP &#9733;</div>
              <div class="title">One thing to try.</div>
              <div class="body">A tool or skill worth testing. Usually in under a minute.</div>
            </div>
            <div class="card c3">
              <div class="num">03 / PLAIN ENGLISH</div>
              <div class="title">The jargon, decoded.</div>
              <div class="body">Explained without the jargon.</div>
            </div>
          </div>
        </div>

        <div class="rail">
          <div class="seg"><div class="fill f1"></div></div>
          <div class="seg"><div class="fill f2"></div></div>
          <div class="seg"><div class="fill f3"></div></div>
        </div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>
    <div class="edge"></div>

    <style>
      [data-composition-id="s4-inside"] { position: absolute; inset: 0; overflow: hidden; background: transparent; font-family: "Sora", Helvetica, Arial, sans-serif; }
      [data-composition-id="s4-inside"] .stage { position: absolute; inset: 0; background: #F1ECE3; clip-path: inset(100% 0% 0% 0%); }
      [data-composition-id="s4-inside"] .edge { position: absolute; top: 0; left: 0; width: 100%; height: 18px; background: #DDB892; transform: translateY(1080px); }

      [data-composition-id="s4-inside"] .content {
        width: 100%; height: 100%; padding: 110px 100px 120px;
        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      }
      [data-composition-id="s4-inside"] .eyebrow { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600; font-size: 26px; letter-spacing: 5px; color: #B5532E; }

      [data-composition-id="s4-inside"] .deck-wrap { perspective: 1800px; }
      [data-composition-id="s4-inside"] .deck { position: relative; width: 1240px; height: 560px; transform-style: preserve-3d; }
      [data-composition-id="s4-inside"] .card {
        position: absolute; inset: 0;
        background: #FFFFFF; border: 1px solid #C49A70; border-radius: 30px;
        padding: 64px 72px;
        display: flex; flex-direction: column; justify-content: center; gap: 26px;
        box-shadow: 0 40px 80px -30px rgba(31,27,23,0.35);
        backface-visibility: hidden;
        opacity: 0;
      }
      [data-composition-id="s4-inside"] .card.feature { background: #B5532E; border-color: #B5532E; }
      [data-composition-id="s4-inside"] .num { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600; font-size: 28px; letter-spacing: 4px; color: #B5532E; }
      [data-composition-id="s4-inside"] .feature .num { color: #F4E7DC; }
      [data-composition-id="s4-inside"] .title { font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -3.4px; color: #1F1B17; }
      [data-composition-id="s4-inside"] .feature .title { color: #F1ECE3; }
      [data-composition-id="s4-inside"] .body { font-family: "Manrope", Helvetica, Arial, sans-serif; font-weight: 500; font-size: 40px; line-height: 1.4; color: #4B433A; }
      [data-composition-id="s4-inside"] .feature .body { color: #F8F1E9; }

      [data-composition-id="s4-inside"] .rail { display: flex; gap: 18px; }
      [data-composition-id="s4-inside"] .seg { width: 150px; height: 8px; border-radius: 4px; background: rgba(31,27,23,0.12); overflow: hidden; }
      [data-composition-id="s4-inside"] .fill { width: 100%; height: 100%; background: #B5532E; transform: scaleX(0); transform-origin: left center; }

      [data-composition-id="s4-inside"] .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(31,27,23,0.12) 100%); }
      [data-composition-id="s4-inside"] .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.035;
        background-image: radial-gradient(rgba(31,27,23,0.35) 1px, transparent 1px), radial-gradient(rgba(31,27,23,0.25) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px; }
    </style>

    <script>
      (() => {
        const SLOT = 3.6;
        const ID = 's4-inside';
        const root = document.querySelector('[data-composition-id="s4-inside"]');
        const q = (s) => root.querySelector(s);

        const tl = gsap.timeline({ paused: true });

        // ENTRY — cover wipe up over the terracotta turn; sand edge rides the seam.
        tl.fromTo(q('.stage'), { clipPath: 'inset(100% 0% 0% 0%)' },
          { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.46, ease: 'power3.inOut' }, 0);
        tl.fromTo(q('.edge'), { y: 1080 }, { y: -18, duration: 0.46, ease: 'power3.inOut' }, 0);

        tl.from(q('.eyebrow'), { y: -30, opacity: 0, duration: 0.3, ease: 'power3.out' }, 0.34);
        tl.from(q('.rail'), { y: 20, opacity: 0, duration: 0.3, ease: 'power2.out' }, 0.40);

        // 3D deck: each card hinges in from -88deg, holds, hinges out to +88deg.
        const cards = [
          { c: '.c1', f: '.f1', inAt: 0.40, outAt: 1.36 },
          { c: '.c2', f: '.f2', inAt: 1.52, outAt: 2.48 },
          { c: '.c3', f: '.f3', inAt: 2.64, outAt: null }
        ];
        cards.forEach((k) => {
          // immediateRender:false — otherwise all three cards would sit as edge-on
          // slivers from t=0 instead of staying hidden until their turn.
          tl.set(q(k.c), { opacity: 1 }, k.inAt);
          tl.fromTo(q(k.c), { rotationY: -88, z: -120 },
            { rotationY: 0, z: 0, duration: 0.36, ease: 'back.out(1.3)', immediateRender: false }, k.inAt);
          const hold = (k.outAt || SLOT) - k.inAt;
          tl.to(q(k.f), { scaleX: 1, duration: hold, ease: 'none' }, k.inAt);
          if (k.outAt) {
            tl.to(q(k.c), { rotationY: 88, z: -120, duration: 0.18, ease: 'power2.in' }, k.outAt);
            tl.set(q(k.c), { opacity: 0 }, k.outAt + 0.18);
          }
        });

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
