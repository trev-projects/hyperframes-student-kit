<template id="s2-signal-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="s2-signal" data-start="0" data-duration="2.2" data-width="1920" data-height="1080">
    <div class="stage">
      <!-- Slice-bar wipe: eight paper bars close over the outgoing noise scene. -->
      <div class="bars"></div>

      <canvas class="wave" width="1920" height="1080"></canvas>

      <div class="head">
        <div class="h1">Some of it is</div>
        <div class="h2"><span class="sw"></span><span class="h2t">signal.</span></div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="s2-signal"] { position: absolute; inset: 0; overflow: hidden; background: transparent; font-family: "Sora", Helvetica, Arial, sans-serif; }
      [data-composition-id="s2-signal"] .stage { position: absolute; inset: 0; }
      [data-composition-id="s2-signal"] .bars { position: absolute; inset: 0; display: flex; }
      [data-composition-id="s2-signal"] .bar { flex: 1 1 0; height: 100%; background: #F1ECE3; transform: scaleY(0); }
      [data-composition-id="s2-signal"] .wave { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      [data-composition-id="s2-signal"] .head {
        position: absolute; top: 120px; left: 100px; right: 100px;
        display: flex; flex-direction: column; gap: 4px;
      }
      [data-composition-id="s2-signal"] .h1 { font-weight: 800; font-size: 96px; line-height: 1; letter-spacing: -2.6px; color: #1F1B17; }
      [data-composition-id="s2-signal"] .h2 { position: relative; align-self: flex-start; padding: 0 12px; margin-left: -12px; }
      [data-composition-id="s2-signal"] .h2t { position: relative; z-index: 1; font-weight: 800; font-size: 210px; line-height: 1; letter-spacing: -8px; color: #1F1B17; }
      [data-composition-id="s2-signal"] .sw { position: absolute; left: 0; right: 0; bottom: 22px; height: 22%; background: #DDB892; transform: scaleX(0); transform-origin: left center; z-index: 0; }

      [data-composition-id="s2-signal"] .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(31,27,23,0.12) 100%); }
      [data-composition-id="s2-signal"] .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.035;
        background-image: radial-gradient(rgba(31,27,23,0.35) 1px, transparent 1px), radial-gradient(rgba(31,27,23,0.25) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px; }
    </style>

    <script>
      (() => {
        const SLOT = 2.2;
        const ID = 's2-signal';
        const root = document.querySelector('[data-composition-id="s2-signal"]');
        const q = (s) => root.querySelector(s);

        const barsEl = q('.bars');
        const bars = [];
        for (let i = 0; i < 8; i++) {
          const b = document.createElement('div');
          b.className = 'bar';
          b.style.transformOrigin = i % 2 ? 'center bottom' : 'center top';
          barsEl.appendChild(b);
          bars.push(b);
        }

        // ---- Canvas 2D waveform: noise resolves into signal behind a scanner ----
        const canvas = q('.wave');
        const ctx = canvas.getContext('2d');
        const W = 1920, CY = 760, AMP = 150;
        const clamp = (v) => Math.max(0, Math.min(1, v));
        const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
        const noisy = (x, t) =>
          0.55 * Math.sin(x * 0.051 + t * 9.1) +
          0.35 * Math.sin(x * 0.137 + t * 13.7 + 1.3) +
          0.26 * Math.sin(x * 0.311 - t * 7.3 + 2.1) +
          0.18 * Math.sin(x * 0.73 + t * 21.0 + 0.4) +
          0.12 * Math.sin(x * 1.9 - t * 17.0 + 3.3);
        const clean = (x, t) => 0.9 * Math.sin(x * 0.0105 + t * 3.2);

        function draw(t) {
          ctx.clearRect(0, 0, W, 1080);
          const reveal = clamp((t - 0.28) / 0.3);            // wave fades in once bars close
          if (reveal <= 0) return;
          const s = ease(clamp((t - 0.55) / 1.0));             // scanner sweep progress
          const sx = -80 + s * (W + 160);
          const yAt = (x) => {
            const b = clamp((sx + 70 - x) / 140);               // 1 = clean side of scanner
            return CY + AMP * (b * clean(x, t) + (1 - b) * noisy(x, t) * 0.9);
          };
          const path = () => {
            ctx.beginPath();
            for (let x = 0; x <= W; x += 3) {
              const y = yAt(x);
              if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
          };
          ctx.globalAlpha = reveal;
          ctx.lineJoin = 'round'; ctx.lineCap = 'round';

          // Noise side
          ctx.save(); ctx.beginPath(); ctx.rect(sx, 0, W, 1080); ctx.clip();
          path(); ctx.strokeStyle = 'rgba(139,129,115,0.85)'; ctx.lineWidth = 3; ctx.stroke();
          ctx.restore();

          // Signal side
          ctx.save(); ctx.beginPath(); ctx.rect(0, 0, Math.max(0, sx), 1080); ctx.clip();
          path(); ctx.strokeStyle = '#B5532E'; ctx.lineWidth = 8; ctx.stroke();
          ctx.restore();

          // Scanner
          if (s > 0 && s < 1) {
            ctx.save();
            ctx.shadowColor = 'rgba(221,184,146,0.9)'; ctx.shadowBlur = 24;
            ctx.fillStyle = '#DDB892';
            ctx.fillRect(sx - 3, CY - 230, 6, 460);
            ctx.beginPath(); ctx.arc(sx, yAt(sx), 13, 0, Math.PI * 2);
            ctx.fillStyle = '#B5532E'; ctx.fill();
            ctx.restore();
          }
          ctx.globalAlpha = 1;
        }
        draw(0);

        const tl = gsap.timeline({ paused: true });

        // ENTRY — bars close over 01's noise field (alternating top/bottom origins).
        tl.to(bars, { scaleY: 1, duration: 0.32, ease: 'power3.inOut', stagger: 0.035 }, 0);

        const clock = { t: 0 };
        tl.to(clock, { t: SLOT, duration: SLOT, ease: 'none', onUpdate: () => draw(clock.t) }, 0);

        tl.from(q('.h1'), { x: -60, opacity: 0, duration: 0.34, ease: 'expo.out' }, 0.42);
        tl.from(q('.h2t'), { y: 90, opacity: 0, duration: 0.42, ease: 'back.out(1.6)' }, 0.56);
        tl.to(q('.sw'), { scaleX: 1, duration: 0.38, ease: 'power3.out' }, 1.50);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
