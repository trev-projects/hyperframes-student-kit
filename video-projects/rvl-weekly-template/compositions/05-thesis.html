<template id="05-thesis-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="05-thesis" data-start="0" data-duration="4" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="stack">
        <div class="ln ln1">EVERY TOP FUND</div>
        <div class="ln ln2">NOW HAS A</div>
        <div class="ln ln3" data-split>PHYSICAL AI</div>
        <div class="ln ln4" data-split>THESIS.</div>
        <div class="ln4-underline"></div>
      </div>
      <div class="source">SOURCE &mdash; RVL ANALYSIS &bull; 2026</div>
      <div class="wipe"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="05-thesis"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="05-thesis"] .stage { position: absolute; inset: 0; }
      [data-composition-id="05-thesis"] .stack {
        position: absolute;
        top: 50%; left: 100px;
        transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 0;
      }
      [data-composition-id="05-thesis"] .ln {
        letter-spacing: -0.035em;
        line-height: 0.95;
      }
      [data-composition-id="05-thesis"] .ln1 {
        font-size: 130px;
        color: #ffffff;
        opacity: 0;
      }
      [data-composition-id="05-thesis"] .ln2 {
        font-size: 110px;
        color: #ffffff;
        opacity: 0;
      }
      [data-composition-id="05-thesis"] .ln3,
      [data-composition-id="05-thesis"] .ln4 {
        font-size: 220px;
        color: #c3f53b;
        text-shadow: 0 0 54px rgba(195,245,59,0.45);
        white-space: nowrap;
        line-height: 1.02;
      }
      [data-composition-id="05-thesis"] .ln3 { margin-top: 6px; }
      [data-composition-id="05-thesis"] .ln3 .ch,
      [data-composition-id="05-thesis"] .ln4 .ch {
        display: inline-block;
        opacity: 0;
        transform: translateY(60px) rotate(8deg);
        will-change: opacity, transform;
      }
      [data-composition-id="05-thesis"] .ln4-underline {
        height: 10px;
        margin-top: 14px;
        width: 620px;
        background: #c3f53b;
        transform: scaleX(0);
        transform-origin: left center;
        box-shadow: 0 0 24px rgba(195,245,59,0.7);
      }
      [data-composition-id="05-thesis"] .source {
        position: absolute;
        bottom: 96px; right: 100px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.22em;
        color: #ffffff;
        opacity: 0;
      }
      [data-composition-id="05-thesis"] .wipe {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #c3f53b;
        z-index: 30;
      }
      [data-composition-id="05-thesis"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 4;
        const sel = (q) => `[data-composition-id="05-thesis"] ${q}`;

        document.querySelectorAll(sel('[data-split]')).forEach((node) => {
          const text = node.textContent;
          node.innerHTML = text.split('').map((c) =>
            c === ' '
              ? '<span class="ch space">&nbsp;</span>'
              : `<span class="ch">${c}</span>`
          ).join('');
        });

        const tl = gsap.timeline({ paused: true });

        // Setup lines 1-2 intros
        tl.fromTo(sel('.ln1'),
          { x: -40, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.28, ease: 'expo.out' }, 0.08);
        tl.fromTo(sel('.ln2'),
          { x: -40, opacity: 0 },
          { x: 0, opacity: 0.80, duration: 0.28, ease: 'expo.out' }, 0.30);

        // Hero line 1 — "PHYSICAL AI" per-char burst
        tl.to(sel('.ln3 .ch'),
          { y: 0, rotate: 0, opacity: 1,
            duration: 0.35, ease: 'back.out(2)',
            stagger: 0.022 }, 0.58);

        // Hero line 2 — "THESIS." per-char burst
        tl.to(sel('.ln4 .ch'),
          { y: 0, rotate: 0, opacity: 1,
            duration: 0.40, ease: 'back.out(2.2)',
            stagger: 0.028 }, 0.95);

        // Underline sweep under THESIS.
        tl.to(sel('.ln4-underline'),
          { scaleX: 1, duration: 0.55, ease: 'power3.out' }, 1.30);

        // Source stamp
        tl.fromTo(sel('.source'),
          { opacity: 0 },
          { opacity: 0.7, duration: 0.4, ease: 'power2.out' }, 1.50);

        // HOLD — full resolved state from ~1.85s to 3.30s (1.45s)

        // Exit
        tl.to(sel('.stack'),
          { rotation: -2, y: -80, opacity: 0, duration: 0.45, ease: 'power2.in' }, 3.30);
        tl.to(sel('.source'),
          { opacity: 0, duration: 0.30, ease: 'power2.in' }, 3.30);

        tl.fromTo(sel('.wipe'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.35, ease: 'power3.in' }, 3.65);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['05-thesis'] = tl;
      })();
    </script>
  </div>
</template>
