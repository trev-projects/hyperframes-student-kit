<template id="07-cta-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="07-cta" data-start="0" data-duration="3" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="rvl-big">RVL</div>
      <div class="tagline">REVEALING&nbsp;THE&nbsp;FUTURE&nbsp;OF&nbsp;BRANDS,&nbsp;STARTUPS,&nbsp;AND&nbsp;VENTURE&nbsp;CAPITAL.</div>
      <div class="cta-line">
        <span class="cta-main">Read the latest issue and sign up at</span>
        <span class="cta-url">rvl.tech</span>
      </div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="07-cta"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="07-cta"] .stage { position: absolute; inset: 0; }
      [data-composition-id="07-cta"] .rvl-big {
        position: absolute;
        top: 45%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 520px;
        color: #c3f53b;
        letter-spacing: -0.03em;
        line-height: 0.85;
        white-space: nowrap;
        opacity: 0;
        text-shadow: 0 0 60px rgba(195,245,59,0.45);
      }
      [data-composition-id="07-cta"] .tagline {
        position: absolute;
        top: 76%; left: 50%;
        transform: translateX(-50%);
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.14em;
        color: #ffffff;
        opacity: 0;
        text-align: center;
        max-width: 1600px;
      }
      [data-composition-id="07-cta"] .cta-line {
        position: absolute;
        top: 82%; left: 50%;
        transform: translateX(-50%);
        display: flex; align-items: baseline; gap: 18px;
        opacity: 0;
        white-space: nowrap;
      }
      [data-composition-id="07-cta"] .cta-main {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.02em;
        color: #ffffff;
      }
      [data-composition-id="07-cta"] .cta-url {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 48px;
        letter-spacing: 0.02em;
        color: #c3f53b;
        text-shadow: 0 0 20px rgba(195,245,59,0.55);
      }
      [data-composition-id="07-cta"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3;
        const sel = (q) => `[data-composition-id="07-cta"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.rvl-big'),
          { scale: 0.82, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(1.3)' }, 0.0);

        tl.fromTo(sel('.tagline'),
          { y: 24, opacity: 0 },
          { y: 0, opacity: 0.92, duration: 0.45, ease: 'power3.out' }, 0.35);

        tl.fromTo(sel('.cta-line'),
          { y: 16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.70);

        // Pulse glow on URL for last half-second
        tl.to(sel('.cta-url'),
          { textShadow: '0 0 34px rgba(195,245,59,0.95)', duration: 0.5,
            yoyo: true, repeat: 1, ease: 'sine.inOut' }, 2.20);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['07-cta'] = tl;
      })();
    </script>
  </div>
</template>
