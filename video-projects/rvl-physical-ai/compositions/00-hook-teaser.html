<template id="00-hook-teaser-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="00-hook-teaser" data-start="0" data-duration="2" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="this-week">THIS WEEK</div>
      <div class="label-sm">W17 &middot; APR 21</div>

      <div class="hit-cut hc-1">PHYSICAL AI</div>
      <div class="hit-cut hc-2">$1.5B</div>
      <div class="hit-cut hc-3">HUMANOIDS</div>
      <div class="hit-cut hc-4">NEW<br/>CATEGORY</div>

      <div class="arrow-down">&darr;</div>
      <div class="flash-fill"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="00-hook-teaser"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="00-hook-teaser"] .stage { position: absolute; inset: 0; }
      [data-composition-id="00-hook-teaser"] .this-week {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 220px;
        color: #c3f53b;
        letter-spacing: -0.03em;
        line-height: 0.9;
        white-space: nowrap;
        text-shadow: 0 0 48px rgba(195,245,59,0.45);
        opacity: 0;
      }
      [data-composition-id="00-hook-teaser"] .label-sm {
        position: absolute;
        top: 60px; right: 100px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.22em;
        color: #c3f53b;
        opacity: 0;
      }
      [data-composition-id="00-hook-teaser"] .hit-cut {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 240px;
        color: #ffffff;
        letter-spacing: -0.04em;
        line-height: 0.85;
        white-space: nowrap;
        text-align: center;
        opacity: 0;
      }
      [data-composition-id="00-hook-teaser"] .hc-1 { font-size: 280px; color: #c3f53b; text-shadow: 0 0 56px rgba(195,245,59,0.4); }
      [data-composition-id="00-hook-teaser"] .hc-2 {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 420px;
        color: #c3f53b;
        text-shadow: 0 0 60px rgba(195,245,59,0.5);
      }
      [data-composition-id="00-hook-teaser"] .hc-3 { font-size: 220px; }
      [data-composition-id="00-hook-teaser"] .hc-4 { font-size: 200px; color: #c3f53b; text-shadow: 0 0 48px rgba(195,245,59,0.4); }

      [data-composition-id="00-hook-teaser"] .arrow-down {
        position: absolute;
        bottom: 120px; left: 50%;
        transform: translateX(-50%);
        font-family: "Archivo Black", sans-serif;
        font-size: 140px;
        color: #c3f53b;
        opacity: 0;
        text-shadow: 0 0 28px rgba(195,245,59,0.55);
      }
      [data-composition-id="00-hook-teaser"] .flash-fill {
        position: absolute; inset: 0;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        z-index: 20;
      }
      [data-composition-id="00-hook-teaser"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 2;
        const sel = (q) => `[data-composition-id="00-hook-teaser"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        // THIS WEEK slam in
        tl.fromTo(sel('.this-week'),
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.25, ease: 'back.out(1.8)' }, 0.05);
        // ... hold briefly, then shrink to label
        tl.to(sel('.this-week'),
          { scale: 0.35, opacity: 0, y: -320, duration: 0.28, ease: 'power3.in' }, 0.45);

        // Little mono stamp in the corner reveals
        tl.fromTo(sel('.label-sm'),
          { x: 20, opacity: 0 },
          { x: 0, opacity: 0.85, duration: 0.30, ease: 'power3.out' }, 0.55);

        // Hit cut 1: PHYSICAL AI
        const cuts = [
          { cls: '.hc-1', at: 0.78, hold: 0.22 },
          { cls: '.hc-2', at: 1.03, hold: 0.22 },
          { cls: '.hc-3', at: 1.28, hold: 0.22 },
          { cls: '.hc-4', at: 1.53, hold: 0.27 }
        ];

        cuts.forEach((c) => {
          tl.fromTo(sel(c.cls),
            { scale: 1.18, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.08, ease: 'power2.out' }, c.at);
          tl.to(sel(c.cls),
            { opacity: 0, duration: 0.05, ease: 'none' }, c.at + c.hold);
          // white flash after each cut (2 frames)
          tl.fromTo(sel('.flash-fill'),
            { opacity: 0.0 },
            { opacity: 0.35, duration: 0.04, ease: 'power2.out',
              yoyo: true, repeat: 1 }, c.at - 0.02);
        });

        // Arrow appears at tail with pulse
        tl.fromTo(sel('.arrow-down'),
          { y: -30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.20, ease: 'back.out(2)' }, 1.82);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['00-hook-teaser'] = tl;
      })();
    </script>
  </div>
</template>
