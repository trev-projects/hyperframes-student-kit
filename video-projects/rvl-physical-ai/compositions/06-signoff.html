<template id="06-signoff-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=block" rel="stylesheet" />

  <div data-composition-id="06-signoff" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="line line-1">SOFTWARE ATE THE WORLD.</div>
      <div class="line line-2">
        PHYSICAL&nbsp;AI&nbsp;WILL&nbsp;<span class="move">MOVE</span>&nbsp;IT.
      </div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="06-signoff"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="06-signoff"] .stage { position: absolute; inset: 0; }
      [data-composition-id="06-signoff"] .line {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 180px;
        letter-spacing: -0.035em;
        line-height: 0.92;
        white-space: nowrap;
        opacity: 0;
      }
      [data-composition-id="06-signoff"] .line-1 { top: 34%; color: #ffffff; }
      [data-composition-id="06-signoff"] .line-2 { top: 54%; color: #c3f53b; text-shadow: 0 0 44px rgba(195,245,59,0.4); }
      [data-composition-id="06-signoff"] .move {
        display: inline-block;
        transform-origin: center;
      }
      [data-composition-id="06-signoff"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 4.5;
        const sel = (q) => `[data-composition-id="06-signoff"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.line-1'),
          { y: 30, opacity: 0, scale: 1.05 },
          { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.3)' }, 0.10);

        tl.fromTo(sel('.line-2'),
          { y: 30, opacity: 0, scale: 1.05 },
          { y: 0, opacity: 1, scale: 1, duration: 0.50, ease: 'back.out(1.3)' }, 1.80);

        // MOVE wobble
        tl.to(sel('.move'),
          { rotation: 4, duration: 0.25, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 2.50);

        // Exit together — slide down
        tl.to([sel('.line-1'), sel('.line-2')],
          { y: 180, opacity: 0, duration: 0.45, ease: 'power2.in' }, 4.00);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['06-signoff'] = tl;
      })();
    </script>
  </div>
</template>
