<template id="05-thesis-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="05-thesis" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="stack">
        <div class="ln ln1">EVERY</div>
        <div class="ln ln2">TOP FUND</div>
        <div class="ln ln3">NOW HAS A</div>
        <div class="ln ln4">PHYSICAL AI THESIS.</div>
      </div>
      <div class="source">SOURCE &mdash; RVL ANALYSIS &bull; 2026</div>
      <div class="wipe"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="05-thesis"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="05-thesis"] .stage { position: absolute; inset: 0; }
      [data-composition-id="05-thesis"] .stack {
        position: absolute;
        top: 50%; left: 100px;
        transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 0;
      }
      [data-composition-id="05-thesis"] .ln {
        font-size: 180px;
        color: #ffffff;
        letter-spacing: -0.035em;
        line-height: 0.92;
        opacity: 0;
      }
      [data-composition-id="05-thesis"] .ln4 {
        color: #c3f53b;
        text-shadow: 0 0 44px rgba(195,245,59,0.4);
      }
      [data-composition-id="05-thesis"] .source {
        position: absolute;
        bottom: 96px; right: 100px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.22em;
        color: #ffffff;
        opacity: 0;
      }
      [data-composition-id="05-thesis"] .wipe {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #c3f53b;
        z-index: 30;
      }
      [data-composition-id="05-thesis"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3.5;
        const sel = (q) => `[data-composition-id="05-thesis"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        ['.ln1', '.ln2', '.ln3', '.ln4'].forEach((cls, i) => {
          tl.fromTo(sel(cls),
            { x: -40, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.30, ease: 'expo.out' }, 0.08 + i * 0.25);
        });

        tl.fromTo(sel('.source'),
          { opacity: 0 },
          { opacity: 0.75, duration: 0.4, ease: 'power2.out' }, 1.40);

        // Hold, then rotate/lift
        tl.to(sel('.stack'),
          { rotation: -2, y: -80, opacity: 0, duration: 0.45, ease: 'power2.in' }, 2.70);
        tl.to(sel('.source'),
          { opacity: 0, duration: 0.30, ease: 'power2.in' }, 2.70);

        tl.fromTo(sel('.wipe'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.35, ease: 'power3.in' }, 3.10);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['05-thesis'] = tl;
      })();
    </script>
  </div>
</template>
