<template id="02-thesis-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=block" rel="stylesheet" />

  <div data-composition-id="02-thesis" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="stack">
        <div class="ln ln1" data-split>MOST NEWSLETTERS</div>
        <div class="ln ln2" data-split>MISS THE</div>
        <div class="ln ln3" data-split>NEXT CATEGORY.</div>
        <div class="ln3-underline"></div>
      </div>
      <div class="wipe"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="02-thesis"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="02-thesis"] .stage { position: absolute; inset: 0; }
      [data-composition-id="02-thesis"] .stack {
        position: absolute;
        top: 50%; left: 100px;
        transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 0;
      }
      [data-composition-id="02-thesis"] .ln {
        letter-spacing: -0.035em;
        line-height: 0.95;
      }
      [data-composition-id="02-thesis"] .ln1 {
        font-size: 140px;
        color: #ffffff;
      }
      [data-composition-id="02-thesis"] .ln2 {
        font-size: 130px;
        color: #ffffff;
      }
      [data-composition-id="02-thesis"] .ln3 {
        font-size: 180px;
        color: #c3f53b;
        text-shadow: 0 0 54px rgba(195,245,59,0.45);
        white-space: nowrap;
        line-height: 1.0;
        margin-top: 8px;
      }
      [data-composition-id="02-thesis"] .ln .ch {
        display: inline-block;
        opacity: 0;
        transform: translateY(50px) rotate(6deg);
        will-change: opacity, transform;
      }
      [data-composition-id="02-thesis"] .ln3-underline {
        height: 8px;
        margin-top: 14px;
        width: 100%;
        background: #c3f53b;
        transform: scaleX(0);
        transform-origin: left center;
        box-shadow: 0 0 22px rgba(195,245,59,0.7);
      }
      [data-composition-id="02-thesis"] .wipe {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #c3f53b;
        z-index: 30;
      }
      [data-composition-id="02-thesis"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 5;
        const sel = (q) => `[data-composition-id="02-thesis"] ${q}`;

        document.querySelectorAll(sel('[data-split]')).forEach((node) => {
          const text = node.textContent;
          node.innerHTML = text.split('').map((c) =>
            c === ' '
              ? '<span class="ch space">&nbsp;</span>'
              : `<span class="ch">${c}</span>`
          ).join('');
        });

        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.ln1 .ch'),
          { y: 0, rotate: 0, opacity: 1,
            duration: 0.32, ease: 'back.out(1.6)', stagger: 0.018 }, 0.10);
        tl.to(sel('.ln2 .ch'),
          { y: 0, rotate: 0, opacity: 0.85,
            duration: 0.30, ease: 'back.out(1.6)', stagger: 0.018 }, 0.60);
        tl.to(sel('.ln3 .ch'),
          { y: 0, rotate: 0, opacity: 1,
            duration: 0.36, ease: 'back.out(2)', stagger: 0.022 }, 1.10);

        tl.to(sel('.ln3-underline'),
          { scaleX: 1, duration: 0.60, ease: 'power3.out' }, 1.60);

        // Hold, then block-wipe
        tl.to(sel('.stack'),
          { y: -60, opacity: 0, duration: 0.45, ease: 'power2.in' }, 4.35);

        tl.fromTo(sel('.wipe'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.35, ease: 'power3.in' }, 4.60);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['02-thesis'] = tl;
      })();
    </script>
  </div>
</template>
