<template id="03-topic-reel-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />

  <div data-composition-id="03-topic-reel" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="label-top">WHAT WE COVER</div>

      <div class="topic-stack">
        <div class="topic t1">BRANDS</div>
        <div class="topic t2">STARTUPS</div>
        <div class="topic t3">VENTURE&nbsp;CAPITAL</div>
        <div class="topic t4">PHYSICAL&nbsp;AI</div>
        <div class="topic t5">NEW&nbsp;MEDIA</div>
        <div class="topic t6">FRONTIER&nbsp;TECH</div>
      </div>

      <div class="reel-underline"></div>
      <div class="wipe"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="03-topic-reel"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #0a0a0a;
        font-family: "Archivo Black", sans-serif;
      }
      [data-composition-id="03-topic-reel"] .stage { position: absolute; inset: 0; }
      [data-composition-id="03-topic-reel"] .label-top {
        position: absolute;
        top: 120px; left: 50%;
        transform: translateX(-50%);
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.32em;
        color: #c3f53b;
        opacity: 0;
      }
      [data-composition-id="03-topic-reel"] .topic-stack {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
      }
      [data-composition-id="03-topic-reel"] .topic {
        position: absolute;
        top: 0; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 160px;
        letter-spacing: -0.035em;
        line-height: 0.92;
        white-space: nowrap;
        color: #c3f53b;
        text-shadow: 0 0 52px rgba(195,245,59,0.45);
        opacity: 0;
      }
      [data-composition-id="03-topic-reel"] .reel-underline {
        position: absolute;
        top: calc(50% + 130px); left: 50%;
        transform: translateX(-50%);
        height: 6px;
        width: 720px;
        background: #c3f53b;
        box-shadow: 0 0 20px rgba(195,245,59,0.6);
        transform-origin: left center;
        transform: translateX(-50%) scaleX(0);
        opacity: 0;
      }
      [data-composition-id="03-topic-reel"] .wipe {
        position: absolute; top: 0; left: -100%;
        width: 100%; height: 100%;
        background: #c3f53b;
        z-index: 30;
      }
      [data-composition-id="03-topic-reel"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
        background-image:
          radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 6;
        const sel = (q) => `[data-composition-id="03-topic-reel"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.label-top'),
          { y: -10, opacity: 0 },
          { y: 0, opacity: 0.85, duration: 0.35, ease: 'power3.out' }, 0.10);

        tl.to(sel('.reel-underline'),
          { scaleX: 1, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.25);

        // 6 topics cycle — 0.8s each, overlap by 0.1s for momentum
        const topics = ['.t1','.t2','.t3','.t4','.t5','.t6'];
        const period = 0.80;
        topics.forEach((t, i) => {
          const at = 0.45 + i * period;
          tl.fromTo(sel(t),
            { y: 40, opacity: 0, scale: 0.94 },
            { y: 0, opacity: 1, scale: 1, duration: 0.30, ease: 'back.out(1.8)' }, at);
          tl.to(sel(t),
            { y: -40, opacity: 0, scale: 1.04, duration: 0.25, ease: 'power2.in' }, at + period - 0.10);
        });

        // Block-wipe at end
        tl.fromTo(sel('.wipe'),
          { xPercent: 0 },
          { xPercent: 200, duration: 0.35, ease: 'power3.in' }, 5.65);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['03-topic-reel'] = tl;
      })();
    </script>
  </div>
</template>
