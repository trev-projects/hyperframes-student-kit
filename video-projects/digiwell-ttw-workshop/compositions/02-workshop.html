<template id="02-workshop-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="02-workshop" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="grid-floor"></div>

      <div class="eyebrow">THE WORKSHOP</div>

      <div class="cards-row">
        <!-- Card A: 90 Minutes -->
        <div class="card card-a">
          <div class="card-icon">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="20" stroke="#f9a72c" stroke-width="2.5"/>
              <path d="M24 14v10l6 4" stroke="#f9a72c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="card-stat"><span class="stat-num">90</span><span class="stat-suffix">MIN</span></div>
          <div class="card-label">LIVE SESSION</div>
          <div class="card-tag">Hands-on build</div>
        </div>

        <!-- Card B: Founders -->
        <div class="card card-b">
          <div class="card-icon">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 38c0-8.837 7.163-16 16-16s16 7.163 16 16" stroke="#f9a72c" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="24" cy="16" r="7" stroke="#f9a72c" stroke-width="2.5"/>
              <path d="M4 38c0-5.523 4.477-10 10-10M44 38c0-5.523-4.477-10-10-10" stroke="#f9a72c" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            </svg>
          </div>
          <div class="card-stat"><span class="stat-num" data-target="0">FOR</span></div>
          <div class="card-label">FOUNDERS</div>
          <div class="card-tag">No tech background needed</div>
        </div>

        <!-- Card C: Toronto Tech Week -->
        <div class="card card-c">
          <div class="card-icon">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 4L28.5 16H42L31.5 23.5L36 36L24 28L12 36L16.5 23.5L6 16H19.5L24 4Z" stroke="#f9a72c" stroke-width="2.5" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="card-stat ttw-stat">TTW</div>
          <div class="card-label">TORONTO</div>
          <div class="card-tag">Tech Week · 2025</div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
      <div class="whip-streak"></div>
    </div>

    <style>
      [data-composition-id="02-workshop"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c; font-family: "Inter", sans-serif;
      }
      [data-composition-id="02-workshop"] .stage { position: absolute; inset: 0; }
      [data-composition-id="02-workshop"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.05) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.05) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="02-workshop"] .eyebrow {
        position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
        font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 26px; letter-spacing: 0.38em;
        color: #f9a72c; opacity: 0;
        text-shadow: 0 0 14px rgba(249,167,44,0.40);
      }
      [data-composition-id="02-workshop"] .cards-row {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -42%);
        display: flex; gap: 36px; align-items: stretch;
        width: 1660px;
      }
      [data-composition-id="02-workshop"] .card {
        flex: 1;
        background: rgba(255,255,255,0.032);
        border: 1px solid rgba(249,167,44,0.22);
        border-radius: 20px;
        padding: 48px 44px 44px;
        display: flex; flex-direction: column; align-items: center;
        gap: 0;
        box-shadow: 0 0 60px rgba(249,167,44,0.06), inset 0 1px 0 rgba(255,255,255,0.05);
        opacity: 0; transform: translateY(50px);
      }
      [data-composition-id="02-workshop"] .card-icon {
        width: 64px; height: 64px; margin-bottom: 28px; opacity: 0.9;
      }
      [data-composition-id="02-workshop"] .card-icon svg { width: 100%; height: 100%; }
      [data-composition-id="02-workshop"] .card-stat {
        font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 96px; line-height: 1;
        color: #3de0a6;
        text-shadow: 0 0 20px rgba(61,224,166,0.50);
        display: flex; align-items: baseline; gap: 8px;
        margin-bottom: 12px;
      }
      [data-composition-id="02-workshop"] .stat-suffix {
        font-size: 40px; color: #3de0a6; opacity: 0.75;
        letter-spacing: 0.08em;
      }
      [data-composition-id="02-workshop"] .ttw-stat {
        font-size: 88px; letter-spacing: 0.06em;
      }
      [data-composition-id="02-workshop"] .card-label {
        font-weight: 700; font-size: 28px;
        letter-spacing: 0.20em;
        color: #fff; opacity: 0.88;
        margin-bottom: 14px;
      }
      [data-composition-id="02-workshop"] .card-tag {
        font-size: 20px; color: rgba(255,255,255,0.45);
        font-weight: 500; letter-spacing: 0.01em;
        text-align: center;
      }
      [data-composition-id="02-workshop"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.90) 95%);
        opacity: 0.65;
      }
      [data-composition-id="02-workshop"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
        background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 3px 3px;
      }
      [data-composition-id="02-workshop"] .whip-streak {
        position: absolute; top: 50%; left: 0;
        width: 70%; height: 14px;
        background: linear-gradient(90deg, transparent 0%, rgba(249,167,44,0.95) 50%, transparent 100%);
        filter: blur(10px);
        transform: translate(-150%, -50%);
        opacity: 0; z-index: 30;
      }
    </style>

    <script>
      (() => {
        const SLOT = 3.5;
        const sel = (q) => `[data-composition-id="02-workshop"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'), { backgroundPositionY: '-80px', duration: SLOT, ease: 'none' }, 0);

        tl.fromTo(sel('.eyebrow'),
          { y: -8, opacity: 0 }, { y: 0, opacity: 0.95, duration: 0.35, ease: 'power3.out' }, 0.05);

        // Cards cascade in
        tl.to(sel('.card-a'), { y: 0, opacity: 1, duration: 0.50, ease: 'back.out(1.2)' }, 0.20);
        tl.to(sel('.card-b'), { y: 0, opacity: 1, duration: 0.50, ease: 'back.out(1.2)' }, 0.45);
        tl.to(sel('.card-c'), { y: 0, opacity: 1, duration: 0.50, ease: 'back.out(1.2)' }, 0.70);

        // Subtle breathing hold
        tl.to(sel('.card'), { y: -5, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.50);

        // Whip exit
        tl.set(sel('.whip-streak'), { opacity: 1 }, 3.12);
        tl.fromTo(sel('.whip-streak'),
          { xPercent: -150, scaleX: 0.5 },
          { xPercent: 250, scaleX: 1.5, duration: 0.36, ease: 'power3.in' }, 3.12);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['02-workshop'] = tl;
      })();
    </script>
  </div>
</template>
