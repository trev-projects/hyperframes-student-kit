<template id="03-cta-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="03-cta" data-start="0" data-duration="2.5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="grid-floor"></div>
      <div class="particles" id="particles-cta"></div>
      <div class="swirl">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
      </div>

      <div class="cta">
        <div class="event-label">MAY 28 · 1PM · TORONTO TECH WEEK</div>
        <div class="wordmark">
          <span class="word-text">Digiwell</span>
          <div class="shimmer"></div>
        </div>
        <div class="tagline">MARKETING</div>
        <div class="hosted">Hosted with <span class="hosted-highlight">startGBC</span> at George Brown Polytechnic</div>
        <div class="button">
          <span class="button-label">Grab Your Free Seat</span>
          <span class="button-arrow">&rarr;</span>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="03-cta"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #07080c; font-family: "Inter", sans-serif;
      }
      [data-composition-id="03-cta"] .stage { position: absolute; inset: 0; }
      [data-composition-id="03-cta"] .grid-floor {
        position: absolute; inset: 0;
        transform: perspective(900px) rotateX(60deg) translateY(25%);
        background:
          repeating-linear-gradient(0deg,  rgba(249,167,44,0.05) 0 1px, transparent 1px 80px),
          repeating-linear-gradient(90deg, rgba(249,167,44,0.05) 0 1px, transparent 1px 80px);
        background-color: #07080c;
      }
      [data-composition-id="03-cta"] .swirl {
        position: absolute; top: 50%; left: 50%;
        width: 1400px; height: 1400px;
        transform: translate(-50%, -50%);
      }
      [data-composition-id="03-cta"] .ring {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px dashed rgba(249,167,44,0.14);
      }
      [data-composition-id="03-cta"] .r1 { width: 700px; height: 700px; }
      [data-composition-id="03-cta"] .r2 { width: 1200px; height: 1200px; border-color: rgba(249,167,44,0.08); }
      [data-composition-id="03-cta"] .particles {
        position: absolute; top: 50%; left: 50%;
        width: 1400px; height: 1400px;
        transform: translate(-50%, -50%);
      }
      [data-composition-id="03-cta"] .particle {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle, #ffd480 0%, #f9a72c 40%, transparent 75%);
        filter: blur(1px); opacity: 0;
      }
      [data-composition-id="03-cta"] .cta {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 0;
      }
      [data-composition-id="03-cta"] .event-label {
        font-family: "JetBrains Mono", monospace; font-weight: 700;
        font-size: 22px; letter-spacing: 0.32em;
        color: #f9a72c; opacity: 0;
        text-shadow: 0 0 12px rgba(249,167,44,0.45);
        margin-bottom: 18px;
      }
      [data-composition-id="03-cta"] .wordmark {
        position: relative; display: inline-block;
        font-weight: 800; font-size: 200px;
        letter-spacing: -0.035em; line-height: 1;
        background: linear-gradient(180deg, #ffffff 0%, #f7d99a 55%, #f9a72c 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 0 50px rgba(249,167,44,0.45);
        overflow: hidden; opacity: 0;
      }
      [data-composition-id="03-cta"] .shimmer {
        position: absolute; top: 0; left: -40%;
        width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.65) 50%, transparent 100%);
        filter: blur(12px); mix-blend-mode: screen; pointer-events: none;
      }
      [data-composition-id="03-cta"] .tagline {
        margin-top: 2px; font-weight: 600; font-size: 46px;
        letter-spacing: 0.44em; color: #f9a72c; opacity: 0;
        text-shadow: 0 0 16px rgba(249,167,44,0.30);
      }
      [data-composition-id="03-cta"] .hosted {
        margin-top: 24px;
        font-size: 24px; color: rgba(255,255,255,0.50); font-weight: 500;
        letter-spacing: 0.01em; opacity: 0;
      }
      [data-composition-id="03-cta"] .hosted-highlight { color: #f9a72c; opacity: 0.85; }
      [data-composition-id="03-cta"] .button {
        margin-top: 28px; padding: 16px 40px;
        background: linear-gradient(180deg, #ffba5a 0%, #f9a72c 55%, #e0881c 100%);
        color: #1a1208; font-weight: 700; font-size: 26px;
        letter-spacing: 0.02em; border-radius: 999px;
        display: flex; gap: 14px; align-items: center;
        box-shadow: 0 0 40px rgba(249,167,44,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
        opacity: 0;
      }
      [data-composition-id="03-cta"] .button-arrow { font-size: 28px; font-weight: 800; }
      [data-composition-id="03-cta"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.95) 95%);
        opacity: 0.68;
      }
      [data-composition-id="03-cta"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
        background-image:
          radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
      }
    </style>

    <script>
      (() => {
        const SLOT = 2.5;
        const sel = (q) => `[data-composition-id="03-cta"] ${q}`;

        // Particles
        const root = document.querySelector(sel('.particles'));
        if (root) {
          for (let i = 0; i < 60; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const angle = (i * 137.5) * Math.PI / 180;
            const r = 220 + 460 * Math.abs(Math.sin(i * 0.41 + 0.9));
            const cx = 700 + Math.cos(angle) * r;
            const cy = 700 + Math.sin(angle) * r * 0.58;
            const size = 3 + 7 * Math.abs(Math.cos(i * 0.87));
            p.style.cssText = `left:${cx - size/2}px;top:${cy - size/2}px;width:${size}px;height:${size}px`;
            root.appendChild(p);
          }
        }

        const tl = gsap.timeline({ paused: true });

        tl.to(sel('.grid-floor'), { backgroundPositionY: '-60px', duration: SLOT, ease: 'none' }, 0);
        tl.to(sel('.swirl'), { rotation: 40, duration: SLOT, ease: 'none', transformOrigin: '50% 50%' }, 0);
        tl.to(sel('.particles'), { rotation: -25, duration: SLOT, ease: 'none', transformOrigin: '50% 50%' }, 0);
        tl.to(sel('.particle'), { opacity: 1, duration: 0.7, ease: 'power2.out', stagger: { each: 0.010, from: 'center' } }, 0);

        tl.fromTo(sel('.event-label'), { y: -8, opacity: 0 }, { y: 0, opacity: 0.90, duration: 0.38, ease: 'power3.out' }, 0.08);
        tl.fromTo(sel('.wordmark'), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.65, ease: 'power3.out' }, 0.22);
        tl.fromTo(sel('.tagline'), { opacity: 0, y: 6 }, { opacity: 0.85, y: 0, duration: 0.50, ease: 'power3.out' }, 0.75);
        tl.fromTo(sel('.hosted'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 1.05);
        tl.fromTo(sel('.button'), { opacity: 0, y: 10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.50, ease: 'back.out(1.4)' }, 1.35);

        // Shimmer sweep
        tl.fromTo(sel('.shimmer'), { left: '-40%' }, { left: '100%', duration: 0.70, ease: 'power2.inOut' }, 1.90);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['03-cta'] = tl;
      })();
    </script>
  </div>
</template>
