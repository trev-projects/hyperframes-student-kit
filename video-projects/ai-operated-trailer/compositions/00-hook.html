<template id="00-hook-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="00-hook" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="corner-mark">AI&nbsp;OPERATED<span class="caret">_</span></div>

      <div class="phrase-stack">
        <div class="phrase p1" data-words>400 new AI tools this week.</div>
        <div class="phrase p2" data-words>Maybe three matter.</div>
        <div class="phrase p3" data-words>Knowing which three</div>
        <div class="phrase p4" data-words>is the whole job.</div>
      </div>

      <div class="streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="00-hook"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #F1ECE3;
        font-family: "Sora", Helvetica, Arial, sans-serif;
      }
      [data-composition-id="00-hook"] .stage { position: absolute; inset: 0; }

      [data-composition-id="00-hook"] .corner-mark {
        position: absolute;
        top: 78px; left: 100px;
        font-family: "JetBrains Mono", Consolas, monospace;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 2.6px;
        color: #8B8173;
        opacity: 0;
      }
      [data-composition-id="00-hook"] .caret { color: #B5532E; }

      [data-composition-id="00-hook"] .phrase-stack {
        position: absolute;
        top: 50%; left: 100px; right: 100px;
        transform: translateY(-50%);
        height: 160px;
      }
      [data-composition-id="00-hook"] .phrase {
        position: absolute;
        top: 0; left: 0; right: 0;
        font-weight: 800;
        font-size: 100px;
        line-height: 1.1;
        letter-spacing: -2.4px;
        color: #1F1B17;
        white-space: nowrap;
      }
      [data-composition-id="00-hook"] .p4 { color: #B5532E; }
      [data-composition-id="00-hook"] .phrase .w {
        display: inline-block;
        opacity: 0;
        transform: translateY(44px);
        will-change: opacity, transform;
      }

      [data-composition-id="00-hook"] .streak {
        position: absolute;
        top: 50%; left: 0;
        width: 55%; height: 14px;
        background: linear-gradient(90deg, transparent, #B5532E, transparent);
        filter: blur(9px);
        transform: translateY(-50%);
        opacity: 0;
        z-index: 30;
      }
      [data-composition-id="00-hook"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(31,27,23,0.10) 100%);
        z-index: 35;
      }
      [data-composition-id="00-hook"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.035;
        background-image:
          radial-gradient(rgba(31,27,23,0.35) 1px, transparent 1px),
          radial-gradient(rgba(31,27,23,0.25) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 5;
        const sel = (q) => `[data-composition-id="00-hook"] ${q}`;

        // Word-level split — words land harder than characters on fast cuts.
        document.querySelectorAll(sel('[data-words]')).forEach((node) => {
          node.innerHTML = node.textContent.trim().split(/\s+/)
            .map((w) => `<span class="w">${w}</span>`).join(' ');
        });

        const tl = gsap.timeline({ paused: true });

        tl.fromTo(sel('.corner-mark'),
          { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.05);
        // Caret blinks so the frame is never fully static.
        tl.to(sel('.caret'),
          { opacity: 0, duration: 0.45, repeat: 9, yoyo: true, ease: 'steps(1)' }, 0.45);

        // Four phrases, ~1.1s each. Each exits upward with blur; the next enters
        // from below with matching blur so the cut carries velocity.
        const phrases = [
          { cls: '.p1', in: 0.20, out: 1.25 },
          { cls: '.p2', in: 1.38, out: 2.38 },
          { cls: '.p3', in: 2.50, out: 3.35 },
          { cls: '.p4', in: 3.48, out: null }
        ];

        phrases.forEach((p) => {
          tl.to(sel(p.cls + ' .w'),
            { y: 0, opacity: 1, duration: 0.34, ease: 'expo.out', stagger: 0.045 }, p.in);
          if (p.out !== null) {
            tl.to(sel(p.cls),
              { y: -80, filter: 'blur(18px)', opacity: 0, duration: 0.26, ease: 'power2.in' }, p.out);
          }
        });

        // Hero phrase dollies toward camera on the way out — the piece's first scale move.
        tl.to(sel('.p4'),
          { scale: 1.32, opacity: 0, duration: 0.55, ease: 'power2.in',
            transformOrigin: 'left center' }, 4.30);

        // EXIT — terracotta streak fires at the cut into 01-noise.
        tl.fromTo(sel('.streak'),
          { xPercent: -120, opacity: 0.9, scaleX: 0.6 },
          { xPercent: 240, scaleX: 1.4, duration: 0.36, ease: 'power3.in' }, 4.58);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['00-hook'] = tl;
      })();
    </script>
  </div>
</template>
