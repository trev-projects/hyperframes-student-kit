<template id="04-promise-template">
  <script src="assets/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet" />

  <div data-composition-id="04-promise" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="stage">
      <div class="no-stack">
        <div class="no-item n1"><span class="no-text">No hype.</span><span class="no-strike"></span></div>
        <div class="no-item n2"><span class="no-text">No jargon.</span><span class="no-strike"></span></div>
        <div class="no-item n3"><span class="no-text">No 40-step workflows.</span><span class="no-strike"></span></div>
      </div>

      <div class="payoff">
        <span class="pay-lead">Just what&rsquo;s</span>
        <span class="pay-wrap">
          <span class="pay-swash"></span>
          <span class="pay-key">worth testing.</span>
        </span>
      </div>

      <div class="streak"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="04-promise"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #F1ECE3;
        font-family: "Sora", Helvetica, Arial, sans-serif;
      }
      [data-composition-id="04-promise"] .stage { position: absolute; inset: 0; }

      [data-composition-id="04-promise"] .no-stack {
        position: absolute;
        top: 50%; left: 100px; right: 100px;
        transform: translateY(-50%);
      }
      /* display:table gives shrink-to-fit width in normal block flow, so the
         strike-through spans only the text and the stack still centres. */
      [data-composition-id="04-promise"] .no-item {
        position: relative;
        display: table;
        margin-bottom: 18px;
        opacity: 0;
      }
      [data-composition-id="04-promise"] .no-text {
        font-weight: 800;
        font-size: 76px;
        line-height: 1.18;
        letter-spacing: -1.8px;
        color: #8B8173;
        white-space: nowrap;
      }
      [data-composition-id="04-promise"] .no-strike {
        position: absolute;
        left: -6px; right: -6px;
        top: 52%;
        height: 6px;
        background: #B5532E;
        border-radius: 3px;
        transform: scaleX(0);
        transform-origin: left center;
      }

      [data-composition-id="04-promise"] .payoff {
        position: absolute;
        top: 50%; left: 100px; right: 100px;
        transform: translateY(-50%);
        font-weight: 800;
        font-size: 112px;
        line-height: 1.06;
        letter-spacing: -2.8px;
        color: #1F1B17;
        white-space: nowrap;
        opacity: 0;
      }
      [data-composition-id="04-promise"] .pay-wrap {
        position: relative;
        display: inline-block;
        padding: 0 8px;
      }
      [data-composition-id="04-promise"] .pay-swash {
        position: absolute;
        left: 0; bottom: 4px;
        width: 100%; height: 26%;
        background: #DDB892;
        transform: scaleX(0);
        transform-origin: left center;
        z-index: 0;
      }
      [data-composition-id="04-promise"] .pay-key {
        position: relative; z-index: 1;
      }

      [data-composition-id="04-promise"] .streak {
        position: absolute;
        top: 50%; left: 0;
        width: 55%; height: 14px;
        background: linear-gradient(90deg, transparent, #B5532E, transparent);
        filter: blur(9px);
        transform: translateY(-50%);
        opacity: 0;
        z-index: 30;
      }
      [data-composition-id="04-promise"] .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(31,27,23,0.10) 100%);
        z-index: 35;
      }
      [data-composition-id="04-promise"] .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.035;
        background-image:
          radial-gradient(rgba(31,27,23,0.35) 1px, transparent 1px),
          radial-gradient(rgba(31,27,23,0.25) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        z-index: 40;
      }
    </style>

    <script>
      (() => {
        const SLOT = 5;
        const sel = (q) => `[data-composition-id="04-promise"] ${q}`;
        const tl = gsap.timeline({ paused: true });

        // Three fast negations, each struck through as it lands — 0.50s apart.
        [
          { cls: '.n1', at: 0.10 },
          { cls: '.n2', at: 0.60 },
          { cls: '.n3', at: 1.10 }
        ].forEach((n) => {
          tl.fromTo(sel(n.cls),
            { x: -24, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.28, ease: 'expo.out' }, n.at);
          tl.to(sel(n.cls + ' .no-strike'),
            { scaleX: 1, duration: 0.26, ease: 'power3.out' }, n.at + 0.16);
        });

        // Clear the negatives fast, then land the positive in the same optical spot.
        tl.to(sel('.no-stack'),
          { y: -46, filter: 'blur(16px)', opacity: 0, duration: 0.30, ease: 'power2.in' }, 2.00);

        tl.fromTo(sel('.payoff'),
          { y: 52, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.44, ease: 'expo.out' }, 2.26);
        tl.to(sel('.pay-swash'),
          { scaleX: 1, duration: 0.42, ease: 'power3.out' }, 2.66);

        // EXIT — final streak into the CTA.
        tl.fromTo(sel('.streak'),
          { xPercent: -120, opacity: 0.9, scaleX: 0.6 },
          { xPercent: 240, scaleX: 1.4, duration: 0.36, ease: 'power3.in' }, 4.58);

        tl.to({}, { duration: SLOT }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines['04-promise'] = tl;
      })();
    </script>
  </div>
</template>
